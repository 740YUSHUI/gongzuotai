<script>
/* ===== 灵魂链接工作台 JS - Part 1: Core ===== */
const DB_NAME='SoulLinkWorkstation_DB',DB_VERSION=5,SETTINGS_KEY='soul_link_settings',TIMER_KEY='soul_link_active_timer';
const STORES={tasks:'tasks',timerRecords:'timerRecords',projects:'projects',knowledge:'knowledge',appointments:'appointments',learning:'learning',learningLogs:'learningLogs',transactions:'transactions',emotions:'emotions',reviews:'reviews',soulRecords:'soulRecords',soulProfiles:'soulProfiles',wordCards:'wordCards',wordCardDecks:'wordCardDecks',drawRecords:'drawRecords',reminders:'reminders',images:'images',backups:'backups',dailyReset:'dailyReset',linkStatus:'linkStatus',stars:'stars',dreams:'dreams',dreamSigns:'dreamSigns',inspirations:'inspirations'};

class="item-main"><div class="item-title">'+Utils.esc(na.name||'预约')+'</div><div class="item-sub">'+na.date+' '+na.startTime+' · '+Utils.esc(na.type||'')+'</div></div></div>':'<div class="text-muted text-sm" style="padding:8px">暂无即将到来的预约</div>';const sHtml=soul.length>0?'<div class="privacy-notice"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg> 今天有 '+soul.length+' 条私密记录</div>':'';const ws=Utils.weekStart();const wl=tr.filter(r=>new Date(r.date)>=ws);const wlt=wl.reduce((s,l)=>s+(r.actualDuration||0),0);const wgs=(s.weeklyGoal||10)*3600;const wp=Math.min(100,(wlt/wgs)*100);const pt=tasks.filter(t=>!t.completed).slice(0,5);const et=tasks.filter(t=>!t.completed&&t.dueDate&&Utils.daysBetween(today,t.dueDate)<=2);const te=emos.sort((a,b)=>b.time.localeCompare(a.time));const le=te[0];document.getElementById('main').innerHTML='<div class="page-header"><div><h1><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg> 今日工作台</h1><div class="subtitle">'+now.getFullYear()+'年'+(now.getMonth()+1)+'月'+now.getDate()+'日 星期'+Utils.weekday(now)+' · <span id="clock-time">'+Utils.fmtTime(now)+':'+String(now.getSeconds()).padStart(2,'0')+'</span></div></div></div><div class="greeting mb-4"><span class="js-avatar" onclick="Settings.showProfile()" title="点击编辑个人资料" style="width:46px;height:46px;margin-right:12px;cursor:pointer"></span>'+g+'<span class="time-now"> · '+Utils.esc(s.identity)+'</span></div><div class="daily-quote mb-4" id="daily-quote-box">'+Quote.boxHtml(q)+'</div>'+tHtml+'<div class="grid grid-4 mt-4 mb-4"><div class="stat-card"><div class="stat-icon"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg></div><div class="stat-value">'+doneTasks+'/'+tasks.length+'</div><div class="stat-label">今日完成任务</div></div><div class="stat-card"><div class="stat-icon"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/></svg></div><div class="stat-value" style="font-size:18px">'+Utils.money(bal)+'</div><div class="stat-label">今日结余</div></div><div class="stat-card"><div class="stat-icon"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="7.5" r="3"/><path d="M8 2v1.2M2 7.5h1.2"/><path d="M17.5 11.5a4.5 4.5 0 1 0 0 9H8a4.5 4.5 0 1 0 .8-8.9"/></svg></div><div class="stat-value" style="font-size:18px">'+(le?le.type:'平和')+'</div><div class="stat-label">当前情绪</div></div></div><div class="quick-actions mb-4"><div class="quick-action" onclick="QA.addTask()"><div class="qa-icon"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h9l5 5v13H5z"/><path d="M14 3v5h5M8 12h8M8 16h5"/></svg></div><div class="qa-label">添加任务</div></div><div class="quick-action" onclick="QA.addAppt()"><div class="qa-icon"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg></div><div class="qa-label">添加预约</div></div><div class="quick-action" onclick="QA.addTransaction()"><div class="qa-icon"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/></svg></div><div class="qa-label">记一笔</div></div><div class="quick-action" onclick="QA.recordEmotion()"><div class="qa-icon"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="7.5" r="3"/><path d="M8 2v1.2M2 7.5h1.2"/><path d="M17.5 11.5a4.5 4.5 0 1 0 0 9H8a4.5 4.5 0 1 0 .8-8.9"/></svg></div><div class="qa-label">记录情绪</div></div><div class="quick-action" onclick="QA.recordSoul()"><div class="qa-icon"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z"/></svg></div><div class="qa-label">'+Utils.esc(s.soulName)+'</div></div><div class="quick-action" onclick="QA.recordDream()"><div class="qa-icon"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></div><div class="qa-label">记一个梦</div></div><div class="quick-action" onclick="QA.recordInspiration()"><div class="qa-icon"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.7.6 1 1.5 1 2.5h6c0-1 .3-1.9 1-2.5A6 6 0 0 0 12 3z"/></svg></div><div class="qa-label">记灵感</div></div>'+'<div class="quick-action" onclick="QA.dailyReview()"><div class="qa-icon"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></div><div class="qa-label">每日复盘</div></div></div><div class="grid grid-2"><div class="card"><div class="card-title"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h9l5 5v13H5z"/><path d="M14 3v5h5M8 12h8M8 16h5"/></svg> 今日待办 '+(et.length>0?'<span class="tag tag-danger">'+et.length+'项即将到期</span>':'')+'</div>'+(pt.length>0?pt.map(t=>'<div class="list-item"><div class="checkbox '+(t.completed?'checked':'')+'" onclick="QA.toggleTask(\''+t.id+'\')"></div><div class="item-main"><div class="item-title">'+Utils.esc(t.title)+'</div><div class="item-sub">'+Utils.esc(t.type||'')+(t.dueDate?' · 截止:'+t.dueDate:'')+'</div></div></div>').join(''):'<div class="text-muted text-sm" style="padding:8px">暂无待办任务 <svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z"/></svg></div>')+'</div><div class="card"><div class="card-title"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg> 近期预约</div>'+aHtml+'</div></div><div class="grid grid-2 mt-4"></div><div style="font-size:24px;font-weight:700;color:var(--primary)">'+Math.round(wp)+'%</div></div><div class="text-muted text-sm mt-2">今日专注计时：'+logs.length+'次</div></div><div class="card"><div class="card-title"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/></svg> 今日收支</div><div class="grid grid-3"><div class="text-center"><div style="font-size:12px;color:var(--text-muted)">收入</div><div style="font-size:16px;font-weight:600;color:var(--success)">'+Utils.money(inc)+'</div></div><div class="text-center"><div style="font-size:12px;color:var(--text-muted)">支出</div><div style="font-size:16px;font-weight:600;color:var(--danger)">'+Utils.money(exp)+'</div></div><div class="text-center"><div style="font-size:12px;color:var(--text-muted)">结余</div><div style="font-size:16px;font-weight:600;color:var(--primary)">'+Utils.money(bal)+'</div></div></div></div></div>'+(sHtml?'<div class="mt-4">'+sHtml+'</div>':'')+'<div class="card mt-4"><div class="card-title"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg> 今日复盘</div>'+(reviews.length>0?'<div class="tag tag-success">已完成今日复盘</div>':'<div class="text-muted text-sm">今日尚未完成复盘 <button class="btn btn-sm btn-secondary" onclick="QA.dailyReview()" style="margin-left:8px">去完成</button></div>')+'</div>'};

const Appointments={};
Modules.appointments=async function(){const appts=(await DB.getAll(STORES.appointments)).sort((a,b)=>(b.date+b.startTime).localeCompare(a.date+a.startTime));const today=Utils.today();const up=appts.filter(a=>a.date>=today&&a.status!=='已取消'&&a.status!=='已完成');const past=appts.filter(a=>a.date<today||a.status==='已完成'||a.status==='已取消');document.getElementById('main').innerHTML='<div class="page-header"><div><h1><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg> 预约与重要日程</h1><div class="subtitle">管理客户、合作、咨询与私人约会</div></div><button class="btn btn-primary" onclick="Appointments.showForm()">+ 添加预约</button></div><div class="card mb-4"><div class="card-title"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l-1 7 3 3H7l3-3z"/><path d="M12 14v6"/></svg> 即将到来 ('+up.length+')</div>'+(up.length>0?up.map(a=>Appointments.renderItem(a)).join(''):'<div class="text-muted text-sm" style="padding:8px">暂无即将到来的预约</div>')+'</div><div class="card"><div class="card-title"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3h10a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6"/><path d="M6 21a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h2"/><path d="M9 8h6M9 12h6"/></svg> 历史预约 ('+past.length+')</div><div style="max-height:400px;overflow-y:auto">'+(past.map(a=>Appointments.renderItem(a)).join('')||'<div class="text-muted text-sm" style="padding:8px">暂无历史记录</div>')+'</div></div>'};
Appointments.renderItem=function(a){const sc={待确认:'tag-warning',已确认:'tag-primary',即将开始:'tag-danger',进行中:'tag-danger',已完成:'tag-success',已取消:'',待跟进:'tag-warning'};return '<div class="list-item"><span class="nav-icon"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg></span><div class="item-main"><div class="item-title">'+Utils.esc(a.name||'未命名')+' '+(a.paid?'<span class="tag tag-success">已收款</span>':a.amount?'<span class="tag tag-warning">未收款</span>':'')+'</div><div class="item-sub">'+a.date+' '+a.startTime+'-'+(a.endTime||'')+' · '+Utils.esc(a.type||'')+' · '+Utils.esc(a.location||'')+'</div></div><span class="tag '+(sc[a.status]||'')+'">'+(a.status||'待确认')+'</span><button class="btn-icon btn-ghost" onclick="Appointments.view(\''+a.id+'\')"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg></button></div>'};
Appointments.showForm=function(){Modal.open('添加预约','<div class="form-group"><label>对方称呼</label><input type="text" id="a-name" placeholder="姓名或称呼"></div><div class="form-row"><div class="form-group"><label>日期</label><input type="date" id="a-date" value="'+Utils.today()+'"></div><div class="form-group"><label>开始时间</label><input type="time" id="a-start"></div><div class="form-group"><label>预计结束</label><input type="time" id="a-end"></div></div><div class="form-row"><div class="form-group"><label>类型</label><select id="a-type"><option>咨询</option><option>见面</option><option>上课</option><option>合作</option><option>就医</option><option>私人</option><option>其他</option></select></div><div class="form-group"><label>状态</label><select id="a-status"><option>待确认</option><option>已确认</option><option>即将开始</option><option>进行中</option><option>已完成</option><option>已取消</option><option>待跟进</option></select></div></div><div class="form-row"><div class="form-group"><label>地点/平台</label><input type="text" id="a-location" placeholder="线下地址或线上平台"></div><div class="form-group"><label>联系方式</label><input type="text" id="a-contact" placeholder="电话或账号"></div></div><div class="form-row"><div class="form-group"><label>是否收费</label><select id="a-charged" onchange="document.getElementById(\'a-amt\').style.display=this.value===\'true\'?\'block\':\'none\'"><option value="false">否</option><option value="true">是</option></select></div><div class="form-group" id="a-amt" style="display:none"><label>金额</label><input type="number" id="a-amount" placeholder="0"></div></div><div class="form-group"><label>准备事项</label><textarea id="a-prep" placeholder="提前准备..."></textarea></div><div class="form-group"><label>备注</label><input type="text" id="a-notes"></div>',{footer:'<button class="btn btn-ghost" onclick="Modal.close()">取消</button><button class="btn btn-primary" onclick="Appointments.save()">保存</button>'})};
Appointments.save=async function(){const name=document.getElementById('a-name').value.trim();if(!name){Toast.error('请输入对方称呼');return}const ch=document.getElementById('a-charged').value==='true';await DB.put(STORES.appointments,{id:Utils.uid(),name,date:document.getElementById('a-date').value,startTime:document.getElementById('a-start').value,endTime:document.getElementById('a-end').value,type:document.getElementById('a-type').value,status:document.getElementById('a-status').value,location:document.getElementById('a-location').value,contact:document.getElementById('a-contact').value,charged:ch,amount:ch?parseFloat(document.getElementById('a-amount').value)||0:0,paid:false,prep:document.getElementById('a-prep').value,notes:document.getElementById('a-notes').value,createdAt:Utils.now()});Modal.close();Toast.success('预约已添加');Modules.appointments()};
Appointments.view=async function(id){const a=await DB.get(STORES.appointments,id);if(!a)return;const sts=['待确认','已确认','即将开始','进行中','已完成','已取消','待跟进'];Modal.open('预约详情','<div class="card-pink" style="padding:16px;border-radius:var(--radius);margin-bottom:16px"><h2 style="font-size:18px;color:var(--primary)">'+Utils.esc(a.name)+'</h2><div class="text-sm text-muted mt-2">'+a.date+' '+a.startTime+'-'+(a.endTime||'')+' · '+Utils.esc(a.type)+'</div></div><div class="grid grid-2"><div><span class="text-sm text-muted">地点/平台</span><div>'+Utils.esc(a.location||'-')+'</div></div><div><span class="text-sm text-muted">联系方式</span><div>'+Utils.esc(a.contact||'-')+'</div></div><div><span class="text-sm text-muted">状态</span><div><span class="tag">'+a.status+'</span></div></div><div><span class="text-sm text-muted">收费</span><div>'+(a.charged?Utils.money(a.amount)+(a.paid?' (已收款)':' (未收款)'):'免费')+'</div></div></div>'+(a.prep?'<div class="form-group mt-4"><label>准备事项</label><div style="white-space:pre-wrap">'+Utils.esc(a.prep)+'</div></div>':'')+(a.notes?'<div class="form-group"><label>备注</label><div>'+Utils.esc(a.notes)+'</div></div>':'')+(a.review?'<div class="form-group"><label>复盘</label><div>'+Utils.esc(a.review)+'</div></div>':'')+'<div class="form-group"><label>修改状态</label><select id="av-status" onchange="Appointments.updStatus(\''+a.id+'\')">'+sts.map(s=>'<option value="'+s+'" '+(a.status===s?'selected':'')+'>'+s+'</option>').join('')+'</select></div>',{footer:'<button class="btn btn-ghost" onclick="Modal.close()">关闭</button><button class="btn btn-secondary" onclick="Appointments.addReview(\''+a.id+'\')">添加复盘</button><button class="btn btn-danger" onclick="Appointments.del(\''+a.id+'\')">删除</button>'})};
Appointments.updStatus=async function(id){const a=await DB.get(STORES.appointments,id);if(a){a.status=document.getElementById('av-status').value;await DB.put(STORES.appointments,a);Toast.success('状态已更新')}};
Appointments.addReview=async function(id){const a=await DB.get(STORES.appointments,id);Modal.close();Modal.open('添加预约复盘','<div class="form-group"><label>简短复盘</label><textarea id="ar-review" rows="5" placeholder="这次预约的总结...">'+Utils.esc(a.review||'')+'</textarea></div>',{footer:'<button class="btn btn-ghost" onclick="Modal.close()">取消</button><button class="btn btn-primary" onclick="Appointments.saveReview(\''+id+'\')">保存</button>'})};
Appointments.saveReview=async function(id){const a=await DB.get(STORES.appointments,id);a.review=document.getElementById('ar-review').value;await DB.put(STORES.appointments,a);Modal.close();Toast.success('复盘已保存')};
Appointments.del=async function(id){Modal.confirm('确定删除这条预约吗？',async()=>{await DB.del(STORES.appointments,id);Modal.close();Toast.success('已删除');Modules.appointments()})};

const Finance={filterType:'all',filterCat:'all'};
Modules.finance=async function(){const tx=(await DB.getAll(STORES.transactions)).sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt.localeCompare(a.createdAt));Finance._all=tx;const now=new Date();const today=Utils.today();const ym=today.slice(0,7);const year=today.slice(0,4);const wsStr=Utils.fmtDate(Utils.weekStart());const per=Finance._period||'month';let range=[],label='本月';if(per==='day'){range=tx.filter(t=>t.date===today);label='今日'}else if(per==='week'){range=tx.filter(t=>t.date>=wsStr);label='本周'}else if(per==='year'){range=tx.filter(t=>t.date.startsWith(year));label='全年'}else if(per==='all'){range=tx;label='全部'}else{range=tx.filter(t=>t.date.startsWith(ym));label='本月'}
const inc=range.filter(t=>t.type==='收入').reduce((s2,t)=>s2+t.amount,0);const exp=range.filter(t=>t.type==='支出').reduce((s2,t)=>s2+t.amount,0);const cnt=range.length;const budget=App.settings.budget||5000;const tm=tx.filter(t=>t.date.startsWith(ym));const mExp=tm.filter(t=>t.type==='支出').reduce((s2,t)=>s2+t.amount,0);const mInc=tm.filter(t=>t.type==='收入').reduce((s2,t)=>s2+t.amount,0);const invTx=tx.filter(t=>(t.category||'').indexOf('投资')>=0);const invInc=invTx.filter(t=>t.type==='收入').reduce((s2,t)=>s2+t.amount,0);const invExp=invTx.filter(t=>t.type==='支出').reduce((s2,t)=>s2+t.amount,0);const invPnl=invInc-invExp;const bigTh=Math.max(500,Math.round(budget*0.15));const abn=tx.filter(t=>t.type==='支出'&&t.amount>=bigTh).slice(0,5);const expCats={};range.filter(t=>t.type==='支出').forEach(t=>{expCats[t.category]=(expCats[t.category]||0)+t.amount});
const months=[];let cum=0;for(let m=1;m<=12;m++){const mk=year+'-'+String(m).padStart(2,'0');const mi=tx.filter(t=>t.date.startsWith(mk)).filter(t=>t.type==='收入').reduce((s2,t)=>s2+t.amount,0);const me=tx.filter(t=>t.date.startsWith(mk)).filter(t=>t.type==='支出').reduce((s2,t)=>s2+t.amount,0);cum+=mi-me;months.push({m,inc:mi,exp:me,bal:mi-me,cum})}
const pill=(k,n)=>'<button class="pill'+(per===k?' active':'')+'" onclick="Finance.setPeriod(\''+k+'\')">'+n+'</button>';
const cats=[...new Set([...(App.settings.expenseCats||[]),...(App.settings.incomeCats||[])])];
document.getElementById('main').innerHTML='<div class="page-header"><div><h1><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/></svg> 收支账本</h1><div class="subtitle">记录每一笔收支，自动生成数据报表</div></div><button class="btn btn-primary" onclick="Finance.showForm()">+ 记一笔</button></div>'
+'<div class="flex gap-2 mb-4" style="flex-wrap:wrap">'+pill('day','当日')+pill('week','本周')+pill('month','当月')+pill('year','全年')+pill('all','全部')+'</div>'
+'<div class="grid grid-4 mb-4"><div class="stat-card"><div class="stat-value" style="font-size:18px;color:var(--success)">'+Utils.money(inc)+'</div><div class="stat-label">'+label+'收入</div></div><div class="stat-card"><div class="stat-value" style="font-size:18px;color:var(--danger)">'+Utils.money(exp)+'</div><div class="stat-label">'+label+'支出</div></div><div class="stat-card"><div class="stat-value" style="font-size:18px;color:'+(inc-exp>=0?'var(--success)':'var(--danger)')+'">'+Utils.money(inc-exp)+'</div><div class="stat-label">'+label+'结余</div></div><div class="stat-card"><div class="stat-value" style="font-size:18px">'+cnt+'</div><div class="stat-label">'+label+'笔数</div></div></div>'
+'<div class="grid grid-3 mb-4"><div class="card"><div class="card-title">月度预算（'+ym+'）</div><div class="text-sm text-muted">额度 '+Utils.money(budget)+' · 已用 '+Utils.money(mExp)+'</div><div class="progress-bar mt-2" style="height:10px"><div class="progress-fill" style="width:'+Math.min(100,Math.round(mExp/budget*100))+'%;background:'+(mExp>budget?'var(--danger)':'var(--primary)')+'"></div></div><div style="font-weight:600;margin-top:6px;color:'+(budget-mExp<0?'var(--danger)':'var(--primary)')+'">剩余 '+Utils.money(budget-mExp)+'</div><div class="text-sm text-muted mt-1">当月收入 '+Utils.money(mInc)+'</div></div>'
+'<div class="card"><div class="card-title">累计投资盈亏</div><div style="font-size:22px;font-weight:700;color:'+(invPnl>0?'var(--success)':invPnl<0?'var(--danger)':'var(--text-secondary)')+'">'+(invTx.length?((invPnl>=0?'+':'')+Utils.money(invPnl)):'—')+'</div><div class="text-sm text-muted mt-1">'+(invTx.length?('投资收入 '+Utils.money(invInc)+' · 投资支出 '+Utils.money(invExp)+' · '+invTx.length+' 笔'):'暂无投资类记录（分类含「投资」的收支会自动计入，可在记一笔里用自定义分类添加）')+'</div></div>'
+'<div class="card"><div class="card-title">异常大额消费提醒</div>'+(abn.length?abn.map(t=>'<div class="list-item" style="padding:6px 0"><div class="item-main"><div class="item-title" style="font-size:13px">'+Utils.esc(t.category||'')+(t.note?' · '+Utils.esc(t.note):'')+'</div><div class="item-sub">'+t.date+'</div></div><div style="font-weight:600;color:var(--danger)">'+Utils.money(t.amount)+'</div></div>').join(''):'<div class="text-muted text-sm">暂无超过 '+Utils.money(bigTh)+' 的单笔支出</div>')+'</div></div>'
+'<div class="grid grid-2 mb-4"><div class="card"><div class="card-title">各类支出占比（'+label+'）</div><div style="height:240px"><canvas id="fin-pie"></canvas></div></div><div class="card"><div class="card-title">收支结余变化趋势（'+year+'年按月）</div><div style="height:240px"><canvas id="fin-trend"></canvas></div></div></div>'
+'<div class="card"><div class="card-title">账目明细检索</div><div class="grid grid-4 mb-2"><div class="form-group" style="margin:0"><label>开始日期</label><input type="date" id="ff-from" onchange="Finance.filterList()"></div><div class="form-group" style="margin:0"><label>结束日期</label><input type="date" id="ff-to" onchange="Finance.filterList()"></div><div class="form-group" style="margin:0"><label>分类</label><select id="ff-cat" onchange="Finance.filterList()"><option value="">全部分类</option>'+cats.map(c=>'<option>'+Utils.esc(c)+'</option>').join('')+'</select></div><div class="form-group" style="margin:0"><label>类型</label><select id="ff-type" onchange="Finance.filterList()"><option value="">全部</option><option>支出</option><option>收入</option></select></div></div><div class="form-group"><input type="text" id="ff-q" placeholder="搜索备注 / 分类关键词…" oninput="Finance.filterList()"></div><div id="ff-list" style="max-height:420px;overflow-y:auto"></div></div>';
Finance.filterList();Finance.renderCharts(expCats,months)};
Finance.setPeriod=function(p){Finance._period=p;Modules.finance()};
Finance.filterList=function(){const el=document.getElementById('ff-list');if(!el)return;const from=document.getElementById('ff-from').value;const to=document.getElementById('ff-to').value;const cat=document.getElementById('ff-cat').value;const type=document.getElementById('ff-type').value;const q=document.getElementById('ff-q').value.trim().toLowerCase();let list=(Finance._all||[]);if(from)list=list.filter(t=>t.date>=from);if(to)list=list.filter(t=>t.date<=to);if(cat)list=list.filter(t=>t.category===cat);if(type)list=list.filter(t=>t.type===type);if(q)list=list.filter(t=>((t.note||'')+(t.category||'')).toLowerCase().includes(q));el.innerHTML=list.slice(0,200).map(t=>'<div class="list-item"><span class="nav-icon">'+(t.type==='收入'?'↑':'↓')+'</span><div class="item-main"><div class="item-title">'+Utils.esc(t.category||'')+(t.note?' · '+Utils.esc(t.note):'')+'</div><div class="item-sub">'+t.date+(t.subCategory?' · '+Utils.esc(t.subCategory):'')+'</div></div><div style="font-weight:600;color:'+(t.type==='支出'?'var(--danger)':'var(--success)')+'">'+(t.type==='支出'?'-':'+')+Utils.money(t.amount)+'</div><button class="btn-icon btn-ghost" onclick="Finance.del(\''+t.id+'\')">✕</button></div>').join('')||'<div class="text-muted text-sm" style="padding:8px">没有符合条件的账目</div>'};
Finance.renderCharts=function(expCats,months){if(typeof Chart==='undefined'){return}const pie=document.getElementById('fin-pie');if(pie){const entries=Object.entries(expCats).sort((a,b)=>b[1]-a[1]).slice(0,8);if(App.charts.finPie)App.charts.finPie.destroy();App.charts.finPie=new Chart(pie,{type:'doughnut',data:{labels:entries.map(e=>e[0]),datasets:[{data:entries.map(e=>e[1]),backgroundColor:['#4a4f57','#6e747d','#9aa0a8','#b9bec5','#d4d8dc','#8f959e','#c6cad0','#5f646c'],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{color:'#5f646c',boxWidth:12,font:{size:11}}}}}})}const tr=document.getElementById('fin-trend');if(tr){if(App.charts.finTrend)App.charts.finTrend.destroy();App.charts.finTrend=new Chart(tr,{type:'line',data:{labels:months.map(m=>m.m+'月'),datasets:[{label:'收入',data:months.map(m=>m.inc),borderColor:'#8fb3a0',backgroundColor:'rgba(143,179,160,.12)',tension:.35},{label:'支出',data:months.map(m=>m.exp),borderColor:'#cf9aa0',backgroundColor:'rgba(207,154,160,.12)',tension:.35},{label:'累计结余',data:months.map(m=>m.cum),borderColor:'#4a4f57',backgroundColor:'rgba(74,79,87,.08)',fill:true,tension:.35}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#5f646c',boxWidth:12,font:{size:11}}}},scales:{x:{ticks:{color:'#9aa0a8',font:{size:10}}},y:{ticks:{color:'#9aa0a8',font:{size:10}}}}}})}};

Finance.showForm=function(){const ec=App.settings.expenseCats||[];const ic=App.settings.incomeCats||[];Modal.open('记一笔','<div class="form-row"><div class="form-group"><label>类型</label><select id="f-type" onchange="Finance.updateCats()"><option value="支出">支出</option><option value="收入">收入</option></select></div><div class="form-group"><label>金额</label><input type="number" id="f-amount" placeholder="0.00" step="0.01"></div></div><div class="form-group"><label>分类</label><select id="f-category"></select></div><div class="form-group" id="f-sub-wrap" style="display:none"><label>二级分类</label><select id="f-subcategory">'+(App.settings.shoppingSubCats||[]).map(s=>'<option>'+s+'</option>').join('')+'</select></div><div class="form-row"><div class="form-group"><label>日期</label><input type="date" id="f-date" value="'+Utils.today()+'"></div><div class="form-group"><label>备注</label><input type="text" id="f-note" placeholder="可选"></div></div>',{footer:'<button class="btn btn-ghost" onclick="Modal.close()">取消</button><button class="btn btn-primary" onclick="Finance.save()">保存</button>'});Finance.updateCats()};
Finance.updateCats=function(){const type=document.getElementById('f-type').value;const sel=document.getElementById('f-category');const wrap=document.getElementById('f-sub-wrap');let cats=[];if(type==='支出'){cats=App.settings.expenseCats||[]}else if(type==='收入'){cats=App.settings.incomeCats||[]}else{cats=App.settings.incomeCats||[]}sel.innerHTML=cats.map(c=>'<option value="'+c+'">'+c+'</option>').join('')+'<option value="__custom__">＋ 自定义分类…</option>';wrap.style.display=type==='支出'&&sel.value==='购物'?'block':'none';sel.onchange=()=>{if(sel.value==='__custom__'){Finance.customCat(type);return}wrap.style.display=type==='支出'&&sel.value==='购物'?'block':'none'}};
Finance.customCat=function(type){Finance._catType=type;Finance._keep={type:document.getElementById('f-type').value,amount:document.getElementById('f-amount').value,date:document.getElementById('f-date').value,note:document.getElementById('f-note').value};Modal.open('新增自定义'+type+'分类','<div class="form-group"><label>分类名称</label><input type="text" id="f-newcat" placeholder="输入新的'+type+'分类名称，保存后可直接选用"></div><div class="text-muted text-sm" style="margin-bottom:10px">保存后将永久加入'+type+'分类选项，统计与图表中同样生效。</div>',{footer:'<button class="btn btn-ghost" onclick="Finance.showForm()">取消</button><button class="btn btn-primary" onclick="Finance.saveCat()">保存</button>'})};
Finance.saveCat=function(){const name=document.getElementById('f-newcat').value.trim();if(!name){Toast.error('请输入分类名称');return}const type=Finance._catType||'支出';const key=type==='收入'?'incomeCats':'expenseCats';const cats=App.settings[key]||[];if(cats.includes(name)){Toast.error('该分类已存在');return}cats.push(name);App.settings[key]=cats;Store.setSettings(App.settings);Toast.success('自定义分类「'+name+'」已保存');const k=Finance._keep||{};Finance.showForm();setTimeout(function(){const tEl=document.getElementById('f-type');if(!tEl)return;if(k.type)tEl.value=k.type;Finance.updateCats();const sel=document.getElementById('f-category');if(sel){for(var i=0;i<sel.options.length;i++){if(sel.options[i].value===name){sel.value=name;break}}}if(k.amount)document.getElementById('f-amount').value=k.amount;if(k.date)document.getElementById('f-date').value=k.date;if(k.note)document.getElementById('f-note').value=k.note},60)};

Finance.save=async function(){const amt=parseFloat(document.getElementById('f-amount').value);if(!amt||amt<=0){Toast.error('请输入有效金额');return}const type=document.getElementById('f-type').value;const data={id:Utils.uid(),type,amount:amt,category:document.getElementById('f-category').value,subCategory:type==='支出'&&document.getElementById('f-category').value==='购物'?document.getElementById('f-subcategory').value:null,date:document.getElementById('f-date').value,note:document.getElementById('f-note').value,createdAt:Utils.now()};await DB.put(STORES.transactions,data);Modal.close();Toast.success('已记录');Modules.finance()};
Finance.del=async function(id){Modal.confirm('确定删除这条记录吗？',async()=>{await DB.del(STORES.transactions,id);Toast.success('已删除');Modules.finance()})};

Modules.emotions=async function(){const all=(await DB.getAll(STORES.emotions)).sort((a,b)=>b.date.localeCompare(a.date)||b.time.localeCompare(a.time));const today=Utils.today();const te=all.filter(e=>e.date===today);document.getElementById('main').innerHTML='<div class="page-header"><div><h1><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="7.5" r="3"/><path d="M8 2v1.2M2 7.5h1.2"/><path d="M17.5 11.5a4.5 4.5 0 1 0 0 9H8a4.5 4.5 0 1 0 .8-8.9"/></svg> 情绪天气监测</h1><div class="subtitle">观察情绪的变化，就像观察天气</div></div><button class="btn btn-primary" onclick="Emotions.showForm()">+ 记录情绪</button></div><div class="card mb-4"><div class="card-title"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M6 14l4-4 3 3 6-7"/><path d="M15 6h4v4"/></svg> 今日情绪曲线</div><div class="chart-container-lg"><canvas id="emotion-chart"></canvas></div>'+(te.length===0?'<div class="text-muted text-sm mt-2"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.8.6 1.5 1.6 1.5 2.6h4c0-1 .7-2 1.5-2.6A6 6 0 0 0 12 3z"/></svg> 默认状态为「平和」（系统默认），尚未主动记录</div>':'')+'</div><div class="grid grid-3 mb-4"><div class="stat-card"><div class="stat-icon"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h9l5 5v13H5z"/><path d="M14 3v5h5M8 12h8M8 16h5"/></svg></div><div class="stat-value">'+te.length+'</div><div class="stat-label">今日记录次数</div></div><div class="stat-card"><div class="stat-icon"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6"/><rect x="12" y="8" width="3" height="10"/><rect x="17" y="14" width="3" height="4"/></svg></div><div class="stat-value">'+(te.length>0?te[0].type:'平和')+'</div><div class="stat-label">最近情绪</div></div><div class="stat-card"><div class="stat-icon"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h4"/></svg></div><div class="stat-value">'+(te.length>0?(te.reduce((s,e)=>s+e.intensity,0)/te.length).toFixed(1):'-')+'</div><div class="stat-label">平均强度</div></div></div><div class="card"><div class="card-title"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3h10a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6"/><path d="M6 21a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h2"/><path d="M9 8h6M9 12h6"/></svg> 情绪记录</div><div style="max-height:400px;overflow-y:auto">'+(all.slice(0,50).map(e=>'<div class="list-item"><span class="nav-icon">'+(Emotions.types.find(t=>t.name===e.type)?.icon||'<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="7.5" r="3"/><path d="M8 2v1.2M2 7.5h1.2"/><path d="M17.5 11.5a4.5 4.5 0 1 0 0 9H8a4.5 4.5 0 1 0 .8-8.9"/></svg>')+'</span><div class="item-main"><div class="item-title">'+Utils.esc(e.type)+' ('+e.intensity+'/10)</div><div class="item-sub">'+e.date+' '+e.time+(e.event?' · '+Utils.esc(e.event):'')+'</div></div><button class="btn-icon btn-ghost" onclick="Emotions.view(\''+e.id+'\')"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg></button></div>').join('')||'<div class="text-muted text-sm" style="padding:8px">暂无记录</div>')+'</div></div>';if(te.length>0){Emotions.renderChart(te)}else{Emotions.renderDefaultChart()}};
Emotions.renderChart=function(data){const ctx=document.getElementById('emotion-chart');if(!ctx)return;const labels=data.map(e=>e.time);const intensities=data.map(e=>e.intensity);const colors=data.map(e=>{const t=Emotions.types.find(t=>t.name===e.type);return t?t.color:'#a8d8d8'});if(App.charts.emotion)App.charts.emotion.destroy();App.charts.emotion=new Chart(ctx,{type:'line',data:{labels:labels.length>0?labels:['默认'],datasets:[{label:'情绪强度',data:intensities.length>0?intensities:[5],borderColor:'#8f959d',backgroundColor:'rgba(217,123,142,.1)',fill:true,tension:.4,pointBackgroundColor:colors,pointRadius:6}]},options:{responsive:true,maintainAspectRatio:false,scales:{y:{min:0,max:10,ticks:{stepSize:2}},x:{ticks:{font:{size:10}}}},plugins:{legend:{display:false},tooltip:{callbacks:{label:function(ctx){const e=data[ctx.dataIndex];return e?e.type+': '+e.intensity+'/10':''}}}}}})};
Emotions.renderDefaultChart=function(){const ctx=document.getElementById('emotion-chart');if(!ctx)return;if(App.charts.emotion)App.charts.emotion.destroy();App.charts.emotion=new Chart(ctx,{type:'line',data:{labels:['00:00','06:00','12:00','18:00','24:00'],datasets:[{label:'情绪强度(系统默认)',data:[5,5,5,5,5],borderColor:'#a8d8d8',backgroundColor:'rgba(168,216,216,.1)',fill:true,tension:.4,borderDash:[5,5]}]},options:{responsive:true,maintainAspectRatio:false,scales:{y:{min:0,max:10}},plugins:{legend:{display:false}}}})};
Emotions.showForm=function(){Modal.open('记录情绪','<div class="form-group"><label>情绪类型</label><div style="display:flex;flex-wrap:wrap;gap:6px" id="emo-select">'+Emotions.types.map(t=>'<div class="emotion-btn" data-emo="'+t.name+'" onclick="Emotions.selectEmo(this)"><div class="emo-icon">'+t.icon+'</div><div class="emo-label">'+t.name+'</div></div>').join('')+'</div></div><div class="form-group"><label>情绪强度 (1-10)</label><input type="range" id="e-intensity" min="1" max="10" value="5" oninput="document.getElementById(\'e-int-val\').textContent=this.value"><div style="display:flex;justify-content:space-between"><span>1</span><span style="font-weight:600;color:var(--primary)" id="e-int-val">5</span><span>10</span></div></div><div class="form-group"><label>发生了什么</label><textarea id="e-event" placeholder="描述事件..."></textarea></div><div class="form-group"><label>涉及的人或事</label><input type="text" id="e-people" placeholder="可选"></div><div class="form-group"><label>自动出现的想法</label><textarea id="e-thought" placeholder="当时脑海里冒出的想法..."></textarea></div><div class="form-group"><label>身体感受</label><input type="text" id="e-body" placeholder="如：胸闷、心跳加速..."></div><div class="form-group"><label>我的反应</label><input type="text" id="e-reaction" placeholder="做了什么..."></div><div class="form-group"><label>我真正需要的是什么</label><textarea id="e-need" placeholder="深入思考..."></textarea></div><div class="form-group"><label>是否已缓解</label><select id="e-relieved"><option value="true">是</option><option value="false">否</option></select></div><div class="form-group"><label>补充记录</label><textarea id="e-extra" placeholder="其他想说的..."></textarea></div>',{footer:'<button class="btn btn-ghost" onclick="Modal.close()">取消</button><button class="btn btn-primary" onclick="Emotions.save()">保存</button>'})};
Emotions.selectEmo=function(el){document.querySelectorAll('.emotion-btn').forEach(b=>b.classList.remove('selected'));el.classList.add('selected');Emotions._selected=el.dataset.emo};
Emotions.save=async function(){if(!Emotions._selected){Toast.error('请选择情绪类型');return}const now=new Date();await DB.put(STORES.emotions,{id:Utils.uid(),type:Emotions._selected,intensity:parseInt(document.getElementById('e-intensity').value),event:document.getElementById('e-event').value,people:document.getElementById('e-people').value,thought:document.getElementById('e-thought').value,body:document.getElementById('e-body').value,reaction:document.getElementById('e-reaction').value,need:document.getElementById('e-need').value,relieved:document.getElementById('e-relieved').value==='true',extra:document.getElementById('e-extra').value,date:Utils.today(),time:String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'),createdAt:Utils.now()});Modal.close();Toast.success('情绪已记录');Modules.emotions()};
Emotions.view=async function(id){const e=await DB.get(STORES.emotions,id);if(!e)return;const t=Emotions.types.find(t=>t.name===e.type);Modal.open('情绪记录详情','<div class="card-pink" style="padding:16px;border-radius:var(--radius);margin-bottom:16px;text-align:center"><div style="font-size:36px">'+(t?t.icon:'<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="7.5" r="3"/><path d="M8 2v1.2M2 7.5h1.2"/><path d="M17.5 11.5a4.5 4.5 0 1 0 0 9H8a4.5 4.5 0 1 0 .8-8.9"/></svg>')+'</div><div style="font-size:18px;font-weight:600;color:var(--primary)">'+Utils.esc(e.type)+'</div><div class="text-sm text-muted">强度: '+e.intensity+'/10 · '+e.date+' '+e.time+'</div></div><div class="grid grid-2">'+[{l:'发生了什么',v:e.event},{l:'涉及的人或事',v:e.people},{l:'自动想法',v:e.thought},{l:'身体感受',v:e.body},{l:'我的反应',v:e.reaction},{l:'我真正需要什么',v:e.need}].map(x=>'<div class="card"><div class="text-sm text-muted">'+x.l+'</div><div>'+(x.v?Utils.esc(x.v):'<span class="text-muted">未填写</span>')+'</div></div>').join('')+'</div><div class="mt-4">'+(e.relieved?'<span class="tag tag-success">已缓解</span>':'<span class="tag tag-warning">尚未缓解</span>')+'</div>'+(e.extra?'<div class="form-group mt-4"><label>补充记录</label><div>'+Utils.esc(e.extra)+'</div></div>':''),{footer:'<button class="btn btn-ghost" onclick="Modal.close()">关闭</button><button class="btn btn-danger" onclick="Emotions.del(\''+e.id+'\')">删除</button>'})};
Emotions.del=async function(id){Modal.confirm('确定删除这条情绪记录吗？',async()=>{await DB.del(STORES.emotions,id);Modal.close();Toast.success('已删除');Modules.emotions()})};

Modules.emotionAnalysis=async function(){const all=await DB.getAll(STORES.emotions);document.getElementById('main').innerHTML='<div class="page-header"><div><h1><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 3a3 3 0 0 0-3 3v1.5A3 3 0 0 0 4 10.5 3 3 0 0 0 6 13a3 3 0 0 0 1 5.5A3 3 0 0 0 12 20a3 3 0 0 0 5-1.5 3 3 0 0 0 1-5.5 3 3 0 0 0 2-3.5 3 3 0 0 0-2.5-3V6a3 3 0 0 0-3-3z"/><path d="M12 3v18"/></svg> 情绪循环分析</h1><div class="subtitle">从历史记录中发现模式与规律</div></div></div><div class="ai-notice"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 18H2z"/><path d="M12 10v4M12 17.2v.3"/></svg> 此功能仅用于个人自我观察和复盘，不构成医学诊断或心理治疗建议。</div>';if(all.length<3){document.getElementById('main').innerHTML+='<div class="empty-state"><div class="empty-icon"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6"/><rect x="12" y="8" width="3" height="10"/><rect x="17" y="14" width="3" height="4"/></svg></div><div class="empty-text">至少需要3条情绪记录才能进行分析<br>当前记录数：'+all.length+'</div></div>';return}const typeCount={};all.forEach(e=>{typeCount[e.type]=(typeCount[e.type]||0)+1});const eventCount={};all.forEach(e=>{if(e.event){eventCount[e.event]=(eventCount[e.event]||0)+1}});const timeSlots={morning:0,afternoon:0,evening:0,night:0};all.forEach(e=>{const h=parseInt(e.time?.split(':')[0]||12);if(h>=6&&h<12)timeSlots.morning++;else if(h>=12&&h<18)timeSlots.afternoon++;else if(h>=18&&h<24)timeSlots.evening++;else timeSlots.night++});const sortedTypes=Object.entries(typeCount).sort((a,b)=>b[1]-a[1]);const positiveTypes=['开心','兴奋','满足','平和','放松','期待'];const negativeTypes=['焦虑','烦躁','生气','委屈','伤心','孤独','内疚','嫉妒','恐惧','疲惫','麻木','崩溃'];const posCount=sortedTypes.filter(([t])=>positiveTypes.includes(t)).reduce((s,[,c])=>s+c,0);const negCount=sortedTypes.filter(([t])=>negativeTypes.includes(t)).reduce((s,[,c])=>s+c,0);document.getElementById('main').innerHTML+='<div class="grid grid-2 mb-4"><div class="card"><div class="card-title"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6"/><rect x="12" y="8" width="3" height="10"/><rect x="17" y="14" width="3" height="4"/></svg> 高频情绪</div>'+sortedTypes.slice(0,8).map(([t,c])=>{const tp=Emotions.types.find(x=>x.name===t);return '<div class="list-item"><span class="nav-icon">'+(tp?tp.icon:'<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="7.5" r="3"/><path d="M8 2v1.2M2 7.5h1.2"/><path d="M17.5 11.5a4.5 4.5 0 1 0 0 9H8a4.5 4.5 0 1 0 .8-8.9"/></svg>')+'</span><div class="item-main"><div class="item-title">'+Utils.esc(t)+'</div></div><span class="tag">'+c+'次</span></div>'}).join('')+'</div><div class="card"><div class="card-title"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg> 情绪时间段分布</div>'+[{n:'早晨(6-12)',v:timeSlots.morning},{n:'下午(12-18)',v:timeSlots.afternoon},{n:'晚上(18-24)',v:timeSlots.evening},{n:'深夜(0-6)',v:timeSlots.night}].map(s=>'<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border)"><span style="font-size:13px">'+s.n+'</span><span style="font-size:12px;color:var(--text-secondary)">'+s.v+'次</span></div>').join('')+'</div></div><div class="grid grid-2 mb-4"><div class="card"><div class="card-title"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg> 积极情绪占比</div><div style="text-align:center;padding:20px"><div style="font-size:36px;font-weight:700;color:var(--success)">'+Math.round(posCount/all.length*100)+'%</div><div class="text-sm text-muted">'+posCount+'/'+all.length+'条</div></div></div><div class="card"><div class="card-title"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 13a4.5 4.5 0 1 0 0 9H7a4.5 4.5 0 1 0 .8-8.9"/><path d="M8 19v2M12 20v2M16 19v2"/></svg> 负面情绪占比</div><div style="text-align:center;padding:20px"><div style="font-size:36px;font-weight:700;color:var(--danger)">'+Math.round(negCount/all.length*100)+'%</div><div class="text-sm text-muted">'+negCount+'/'+all.length+'条</div></div></div></div>'+(Object.keys(eventCount).length>0?'<div class="card mb-4"><div class="card-title"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l-1 7 3 3H7l3-3z"/><path d="M12 14v6"/></svg> 高频触发事件</div>'+Object.entries(eventCount).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([e,c])=>'<div class="list-item"><div class="item-main"><div class="item-title">'+Utils.esc(e)+'</div></div><span class="tag">'+c+'次</span></div>').join('')+'</div>':'')+'<div class="ai-notice">以下分析基于历史记录的统计规律，仅供参考，不代表确定性结论。</div>';if(App.settings.aiEnabled&&all.length>=5){const patterns=[];if(negCount>posCount){patterns.push('近期负面情绪记录较多，可能需要关注自己的压力水平和休息质量。')}const topNeg=sortedTypes.find(([t])=>negativeTypes.includes(t));if(topNeg&&topNeg[1]>=3){patterns.push('「'+topNeg[0]+'」是你最常记录的负面情绪（'+topNeg[1]+'次），可以观察它通常在什么情境下出现。')}const topTimeSlot=Object.entries(timeSlots).sort((a,b)=>b[1]-a[1])[0];if(topTimeSlot&&topTimeSlot[1]>=3){const tn={morning:'早晨',afternoon:'下午',evening:'晚上',night:'深夜'}[topTimeSlot[0]];patterns.push('你在'+tn+'时段记录情绪变化最多（'+topTimeSlot[1]+'次），这可能是一天中情绪波动较大的时段。')}if(patterns.length>0){document.getElementById('main').innerHTML+='<div class="card"><div class="card-title"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg> 可能存在的模式</div><div class="ai-content">'+patterns.map(p=>'<p style="margin-bottom:8px">• '+Utils.esc(p)+'</p>').join('')+'</div><div class="ai-notice">以上为AI根据记录统计生成的推测，仅供参考，不代表客观结论。</div></div>'}}};

Modules.stats=async function(){const tr=await DB.getAll(STORES.timerRecords);const tx=await DB.getAll(STORES.transactions);const emos=await DB.getAll(STORES.emotions);const soul=await DB.getAll(STORES.soulRecords);const appts=await DB.getAll(STORES.appointments);const draws=await DB.getAll(STORES.drawRecords);const dreams=await DB.getAll(STORES.dreams);const insps=await DB.getAll(STORES.inspirations);const now=new Date();const today=Utils.today();const ws=Utils.weekStart();const ym=Utils.fmtDate(now).slice(0,7);const tt=tr.filter(r=>r.date===today).reduce((s,r)=>s+(r.actualDuration||0),0);const wt=tr.filter(r=>new Date(r.date)>=ws).reduce((s,r)=>s+(r.actualDuration||0),0);const mt=tr.filter(r=>r.date.startsWith(ym)).reduce((s,r)=>s+(r.actualDuration||0),0);const mi=tx.filter(t=>t.date.startsWith(ym)&&t.type==='收入').reduce((s,t)=>s+t.amount,0);const me=tx.filter(t=>t.date.startsWith(ym)&&t.type==='支出').reduce((s,t)=>s+t.amount,0);const typeStats={};tr.forEach(r=>{if(!typeStats[r.type])typeStats[r.type]={count:0,duration:0};typeStats[r.type].count++;typeStats[r.type].duration+=r.actualDuration||0});document.getElementById('main').innerHTML='<div class="page-header"><div><h1><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6"/><rect x="12" y="8" width="3" height="10"/><rect x="17" y="14" width="3" height="4"/></svg> 综合数据统计</h1><div class="subtitle">全景式查看你的成长数据</div></div></div><div class="grid grid-4 mb-4"><div class="stat-card"><div class="stat-icon"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/></svg></div><div class="stat-value" style="font-size:18px">'+Utils.money(mi-me)+'</div><div class="stat-label">本月结余</div></div></div><div class="card mb-4"><div class="card mb-4"><div class="grid grid-3 mb-4"><div class="stat-card"><div class="stat-icon"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="7.5" r="3"/><path d="M8 2v1.2M2 7.5h1.2"/><path d="M17.5 11.5a4.5 4.5 0 1 0 0 9H8a4.5 4.5 0 1 0 .8-8.9"/></svg></div><div class="stat-value">'+emos.length+'</div><div class="stat-label">情绪记录总数</div></div><div class="stat-card"><div class="stat-icon"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></div><div class="stat-value">'+dreams.length+'</div><div class="stat-label">梦境记录（知梦率 '+(dreams.length?Math.round(dreams.filter(d=>d.lucid==='lucid'||d.lucid==='full').length/dreams.length*100)+'%':'—')+'）</div></div><div class="stat-card"><div class="stat-icon"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.7.6 1 1.5 1 2.5h6c0-1 .3-1.9 1-2.5A6 6 0 0 0 12 3z"/></svg></div><div class="stat-value">' + insps.length + '</div><div class="stat-label">灵感速记</div></div><div class="stat-card"><div class="stat-icon"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z"/></svg></div><div class="stat-value">'+soul.length+'</div><div class="stat-label">灵魂链接记录</div></div><div class="stat-card"><div class="stat-icon"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg></div><div class="stat-value">'+appts.length+'</div><div class="stat-label">预约总数</div></div></div>';const days=[];const labels=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const ds=Utils.fmtDate(d);labels.push((d.getMonth()+1)+'/'+d.getDate());days.push(tr.filter(r=>r.date===ds).reduce((s,r)=>s+(r.actualDuration||0),0)/3600)}if(typeof Chart!=='undefined'){const fctx=document.getElementById('stats-focus-chart');if(fctx){new Chart(fctx,{type:'bar',data:{labels,datasets:[{label:'专注时长(小时)',data:days,backgroundColor:'#8f959d',borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,scales:{y:{beginAtZero:true}}}})}const tctx=document.getElementById('stats-type-chart');if(tctx&&Object.keys(typeStats).length>0){new Chart(tctx,{type:'doughnut',data:{labels:Object.keys(typeStats),datasets:[{data:Object.values(typeStats).map(s=>s.duration/3600),backgroundColor:['#8f959d','#b9bec5','#c5cad1','#7bc4a4','#e8c87b','#8ba8d4','#e3e6ea','#4a4f57']}]},options:{responsive:true,maintainAspectRatio:false}})}}};

Modules.review=async function(){const today=Utils.today();const existing=await DB.get(STORES.reviews,today);const tr=(await DB.getAll(STORES.timerRecords)).filter(r=>r.date===today);const tx=(await DB.getAll(STORES.transactions)).filter(t=>t.date===today);const tasks=(await DB.getAll(STORES.tasks)).filter(t=>t.date===today||t.isDaily);const emos=(await DB.getAll(STORES.emotions)).filter(e=>e.date===today);const soul=(await DB.getAll(STORES.soulRecords)).filter(r=>r.date===today);const focusTime=tr.reduce((s,r)=>s+(r.actualDuration||0),0);const doneTasks=tasks.filter(t=>t.completed).length;const inc=tx.filter(t=>t.type==='收入').reduce((s,t)=>s+t.amount,0);const exp=tx.filter(t=>t.type==='支出').reduce((s,t)=>s+t.amount,0);document.getElementById('main').innerHTML='<div class="page-header"><div><h1><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg> 每日复盘</h1><div class="subtitle">回顾今天，规划明天</div></div></div><div class="card mb-4"><div class="card-title"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h9l5 5v13H5z"/><path d="M14 3v5h5M8 12h8M8 16h5"/></svg> 今日复盘 - '+today+'</div><div class="ai-notice"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.8.6 1.5 1.6 1.5 2.6h4c0-1 .7-2 1.5-2.6A6 6 0 0 0 12 3z"/></svg> 系统可根据当天记录生成复盘草稿，但你可以自由编辑。AI生成内容会明确标注。</div><div class="form-group"><label>今天完成了什么</label><textarea id="r-done" rows="3" placeholder="完成了...">'+Utils.esc(existing?.done||'')+'</textarea></div><div class="form-group"><label>今天最满意的事情</label><textarea id="r-best" rows="2" placeholder="最满意的...">'+Utils.esc(existing?.best||'')+'</textarea>< SoulLink.save=async function(){const title=document.getElementById('s-title').value.trim();if(!title){Toast.error('请输入标题');return}const now=new Date();const profiles=await DB.getAll(STORES.soulProfiles);const pid=SoulLink.currentProfile||profiles[0]?.id;const type=document.getElementById('s-type').value;await DB.put(STORES.soulRecords,{id:Utils.uid(),profileId:pid,title,recordType:type,date:document.getElementById('s-date').value,time:String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'),interactionMethod:type==='真实互动'?(document.getElementById('s-method').value||null):null,whatHappened:document.getElementById('s-happened').value,feeling:document.getElementById('s-feeling').value,emotion:document.getElementById('s-emotion').value,intensity:parseInt(document.getElementById('s-intensity').value)||5,understanding:document.getElementById('s-understanding').value,need:document.getElementById('s-need').value,insight:document.getElementById('s-insight').value,tags:document.getElementById('s-tags').value.split(',').map(s=>s.trim()).filter(Boolean),important:document.getElementById('s-important').value==='true',countAsReal:type==='真实互动'?document.getElementById('s-count').value==='true':false,starId:(document.getElementById('s-star')&&document.getElementById('s-star').value)||null,createdAt:Utils.now()});Modal.close();Toast.success('记录已保存');Modules.soul()};
SoulLink.manageTypes=function(){const s=App.settings;const rt=Array.isArray(s.soulRecordTypes)?s.soulRecordTypes:[];const im=Array.isArray(s.soulMethods)?s.soulMethods:[];const BASE=['真实互动','同步性或显化记录','感想与成长','梦境与直觉','重要纪念'];const enc=encodeURIComponent;const row=(t,kind,locked)=>'<div class="list-item"><div class="item-main"><div class="item-title">'+Utils.esc(t)+(locked?' <span class="tag">内置</span>':'')+'</div></div><div class="flex gap-2">'+(locked?'':'<button class="btn btn-ghost btn-sm" onclick="SoulLink.editType(\''+kind+'\',\''+enc(t)+'\')">编辑</button><button class="btn btn-ghost btn-sm" style="color:var(--danger)" onclick="SoulLink.delType(\''+kind+'\',\''+enc(t)+'\')">删除</button>')+'</div></div>';Modal.open('类型管理','<div class="card mb-4"><div class="card-title">记录类型<div class="text-sm text-muted" style="font-weight:400">内置类型保留，新增类型可编辑/删除；编辑改名会同步更新对应记录</div></div>'+(rt.length?rt.map(t=>row(t,'rt',BASE.includes(t))).join(''):'<div class="text-muted text-sm">暂无</div>')+'<div class="flex gap-2 mt-2"><input type="text" id="mt-add-rt" placeholder="新增记录类型名称" style="flex:1"><button class="btn btn-primary btn-sm" onclick="SoulLink.addType(\'rt\')">添加</button></div></div><div class="card"><div class="card-title">互动方式 / 事件来源</div>'+(im.length?im.map(t=>row(t,'im',false)).join(''):'<div class="text-muted text-sm">暂无，请在下方添加</div>')+'<div class="flex gap-2 mt-2"><input type="text" id="mt-add-im" placeholder="新增互动方式名称" style="flex:1"><button class="btn btn-primary btn-sm" onclick="SoulLink.addType(\'im\')">添加</button></div></div>',{footer:'<button class="btn btn-primary" onclick="Modal.close()">完成</button>'})};
SoulLink.addType=function(kind){const inp=document.getElementById(kind==='rt'?'mt-add-rt':'mt-add-im');const v=(inp.value||'').trim();if(!v){Toast.error('请输入名称');return}const key=kind==='rt'?'soulRecordTypes':'soulMethods';const list=App.settings[key]||(App.settings[key]=[]);const base=['真实互动','同步性或显化记录','感想与成长','梦境与直觉','重要纪念'];if(list.includes(v)||(kind==='rt'&&base.includes(v))){Toast.error('该名称已存在');return}list.push(v);Store.setSettings(App.settings);Toast.success('已添加：'+v);SoulLink.manageTypes()};
SoulLink.editType=function(kind,encName){const old=decodeURIComponent(encName);Modal.open('编辑类型','<div class="form-group"><label>新名称</label><input type="text" id="mt-new-name" value="'+Utils.esc(old)+'"></div>',{footer:'<button class="btn btn-ghost" onclick="SoulLink.manageTypes()">取消</button><button class="btn btn-primary" onclick="SoulLink.saveTypeEdit(\''+kind+'\',\''+encName+'\')">保存</button>'})};
SoulLink.saveTypeEdit=async function(kind,encName){const old=decodeURIComponent(encName);const nv=(document.getElementById('mt-new-name').value||'').trim();if(!nv){Toast.error('请输入名称');return}if(nv===old){SoulLink.manageTypes();return}const key=kind==='rt'?'soulRecordTypes':'soulMethods';const list=App.settings[key]||[];if(list.includes(nv)){Toast.error('该名称已存在');return}const idx=list.indexOf(old);if(idx<0){Toast.error('原类型不存在');return}list[idx]=nv;Store.setSettings(App.settings);const field=kind==='rt'?'recordType':'interactionMethod';const all=await DB.getAll(STORES.soulRecords);let n=0;for(const r of all){if(r[field]===old){r[field]=nv;await DB.put(STORES.soulRecords,r);n++}}Toast.success('已改名'+(n?'，'+n+'条记录已同步':''));Modal.close();if(App.currentModule==='soul'){Modules.soul()}};
SoulLink.delType=async function(kind,encName){const name=decodeURIComponent(encName);const key=kind==='rt'?'soulRecordTypes':'soulMethods';const list=App.settings[key]||[];const field=kind==='rt'?'recordType':'interactionMethod';const all=await DB.getAll(STORES.soulRecords);const used=all.filter(r=>r[field]===name).length;if(used>0){Toast.error('「'+name+'」下有 '+used+' 条记录，请改用「编辑」重命名');return}Modal.confirm('确定删除类型「'+Utils.esc(name)+'」？',()=>{const idx=list.indexOf(name);if(idx>=0){list.splice(idx,1);Store.setSettings(App.settings)}Toast.success('已删除');Modal.close();if(App.currentModule==='soul'){Modules.soul()}})};

const Assets={personIcon:'<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',cropSquare(b64){return new Promise(r=>{const img=new Image();img.onload=()=>{try{const sz=Math.min(img.width,img.height);const c=document.createElement('canvas');c.width=c.height=Math.min(512,sz);c.getContext('2d').drawImage(img,(img.width-sz)/2,(img.height-sz)/2,sz,sz,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.85))}catch(e){r(b64)}};img.onerror=()=>r(b64);img.src=b64})},async apply(){const layer=document.getElementById('bg-layer');if(!layer)return;try{const imgs=await DB.getAll(STORES.images);const bgs=imgs.filter(i=>i.kind==='background');const op=App.settings&&App.settings.bgOpacity!==undefined?App.settings.bgOpacity:0.9;const blur=App.settings&&App.settings.glassBlur!==undefined?App.settings.glassBlur:16;document.documentElement.style.setProperty('--bg-img-opacity',op);document.documentElement.style.setProperty('--glass-blur',blur+'px');if(bgs.length>0){const idx=Math.floor(Date.now()/86400000)%bgs.length;layer.style.backgroundImage='url('+bgs[idx].data+')';layer.style.opacity=op}else{layer.style.backgroundImage='';layer.style.opacity=0}}catch(e){}await Assets.applyAvatars()},async applyAvatars(){let av=null;try{av=await DB.get(STORES.images,'user_avatar')}catch(e){}const els=document.querySelectorAll('.js-avatar');for(const el of els){el.innerHTML=av?'<img src="'+av.data+'" style="width:100%;height:100%;object-fit:cover">':Assets.personIcon}}};

    const wk = LinkStatus.countRange(list, 7), mo = LinkStatus.countRange(list, 31);
    const st = rec ? LinkStatus.statOf(rec.status) : null;
    const qIcon = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 15.5v.5"/></svg>';
    let h = '<div class="card ls-widget mb-4"><div class="ls-weather" style="color:' + (st ? st.color : 'var(--text-muted)') + '" onclick="' + (rec ? 'LinkStatus.detail()' : 'LinkStatus.showForm()') + '">' + (st ? st.icon : qIcon) + '<div><div class="ls-w-label" style="color:var(--text-primary)">今日链接状态：' + (st ? st.label : '未记录') + '</div><div class="ls-w-sub">' + (rec ? (Utils.esc((rec.reason || '').slice(0, 30)) || '点击查看今日记录详情') : '点击记录今天的链接感知状态') + '</div></div></div>';
    h += '<div class="ls-widget-stats"><span>本周：活跃 ' + wk.active + ' · 平静 ' + wk.calm + ' · 偏弱 ' + wk.weak + '</span><span>本月：活跃 ' + mo.active + ' · 平静 ' + mo.calm + ' · 偏弱 ' + mo.weak + '</span><span>今日互动：' + todayInter + ' 次</span></div>';
    h += '<div class="ls-widget-btns"><button class="btn btn-primary btn-sm" onclick="LinkStatus.showForm()">' + (rec ? '修改今日状态' : '记录今日状态') + '</button><button class="btn btn-secondary btn-sm" onclick="LinkStatus.monthly()">月度链接状态分析</button></div>';
    h += '<div class="chart-container" style="height:170px"><canvas id="ls-chart"></canvas></div>';
    h += '<div class="ls-note">状态由你手动选择，系统不做自动判断，也不能推断对方状态；此功能用于长期观察你的链接感知与身体、情绪、现实环境之间可能存在的规律。</div></div>';
    return h;
  },
  showForm() {
    const today = Utils.today();
    DB.get(STORES.linkStatus, 'ls-' + today).then(rec => {
      LinkStatus._edit = rec || null;
      const st = rec ? rec.status : null;
      let h = '<div class="form-group"><label>今日日期：' + today + '（每天仅一条记录，可随时修改）</label><div class="ls-stats-row">';
      LinkStatus.STATS.forEach(t => {
        h += '<div class="ls-st' + (st === t.k ? ' on' : '') + '" data-k="' + t.k + '" onclick="document.querySelectorAll(\'.ls-st\').forEach(e=>e.classList.remove(\'on\'));this.classList.add(\'on\')"><span style="color:' + t.color + '">' + t.icon + '</span><b>' + t.label + '</b><i>' + t.desc + '</i></div>';
      });
      h += '</div></div>';
      h += '<div class="form-group"><label>为什么我认为今天是这个状态？</label><textarea id="ls-reason" rows="3" placeholder="记录你的观察依据，例如：&#10;· 今天实际互动次数 / 是否有聊天交流&#10;· 是否出现同步事件或显化记录&#10;· 是否有梦境或直觉体验&#10;· 今天自己的身体状态 / 现实生活状态">' + (rec ? Utils.esc(rec.reason || '') : '') + '</textarea></div>';
      h += '<div class="form-group"><label>今日现实状态（可多选）</label>';
      for (const g in LinkStatus.FACTOR_GROUPS) {
        h += '<div class="ls-fg"><div class="ls-fg-title">' + g + '</div><div class="ls-tags">';
        LinkStatus.FACTOR_GROUPS[g].forEach(f => {
          const on = rec && (rec.factors || []).includes(f);
          h += '<span class="ls-tag' + (on ? ' on' : '') + '" data-v="' + f + '" onclick="this.classList.toggle(\'on\')">' + f + '</span>';
        });
        h += '</div></div>';
      }
      h += '</div>';
      h += '<div class="form-group"><label>补充说明</label><input type="text" id="ls-extra" placeholder="记录当天的特殊情况" value="' + (rec ? Utils.esc(rec.extra || '') : '') + '"></div>';
      Modal.open('今日链接状态', h, { footer: '<button class="btn btn-ghost" onclick="Modal.close()">取消</button><button class="btn btn-primary" onclick="LinkStatus.save()">保存</button>' });
    });
  },
  save: async function () {
    const sel = document.querySelector('.ls-st.on');
    if (!sel) { Toast.error('请先选择今天的链接状态'); return }
    const status = sel.dataset.k;
    const reason = document.getElementById('ls-reason').value.trim();
    const extra = document.getElementById('ls-extra').value.trim();
    const factors = Array.from(document.querySelectorAll('.ls-tag.on')).map(t => t.dataset.v);
    const date = Utils.today();
    const prev = LinkStatus._edit || {};
    await DB.put(STORES.linkStatus, { id: 'ls-' + date, date: date, status: status, reason: reason, extra: extra, factors: factors, createdAt: prev.createdAt || Utils.now(), updatedAt: Utils.now() });
    Modal.close(); Toast.success('今日链接状态已保存');
    if (status === 'weak') {
      try {
        const emos = (await DB.getAll(STORES.emotions)).filter(e => e.date === date);
        if (emos.some(e => e.type === '低落')) { LinkStatus._askSync(); return }
      } catch (e) { }
    }
    Modules.soul();
  },
  _askSync() {
    Modal.open('联动提示', '<p style="font-size:13px;color:var(--text-secondary);line-height:1.9">检测到今天你既记录了「链接状态：偏弱」，也记录了「情绪：低落」。<br>是否把这次关联同步到情绪记录，方便长期观察两者的关系？</p>', { footer: '<button class="btn btn-ghost" onclick="Modal.close();Modules.soul()">暂不同步</button><button class="btn btn-primary" onclick="LinkStatus.doSync()">同步到情绪</button>' });
  },
  doSync: async function () {
    const now = new Date();
    await DB.put(STORES.emotions, { id: Utils.uid(), type: '低落', intensity: 5, event: '链接状态偏弱（同步自每日链接状态追踪）', people: '', date: Utils.today(), time: String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0'), createdAt: Utils.now() });
    Modal.close(); Toast.success('已同步到情绪记录'); Modules.soul();
  },
  detail() {
    const today = Utils.today();
    DB.get(STORES.linkStatus, 'ls-' + today).then(rec => {
      if (!rec) { LinkStatus.showForm(); return }
      const st = LinkStatus.statOf(rec.status);
      let h = '<div class="ls-detail"><div class="ls-d-head" style="color:' + st.color + '">' + st.icon + ' ' + today + ' · ' + st.label + '</div>';
      h += '<div class="ls-d-row"><b>状态依据：</b>' + Utils.esc(rec.reason || '（未填写）') + '</div>';
      if ((rec.factors || []).length) h += '<div class="ls-d-row"><b>现实状态：</b>' + rec.factors.map(f => '<span class="ls-tag on">' + f + '</span>').join(' ') + '</div>';
      if (rec.extra) h += '<div class="ls-d-row"><b>补充说明：</b>' + Utils.esc(rec.extra) + '</div>';
      h += '</div>';
      Modal.open('今日链接状态详情', h, { footer: '<button class="btn btn-ghost" onclick="Modal.close()">关闭</button><button class="btn btn-primary" onclick="LinkStatus.showForm()">修改</button>' });
    });
  },
  renderChart(list) {
    const ctx = document.getElementById('ls-chart');
    if (!ctx) return;
    if (App.charts.ls) { try { App.charts.ls.destroy() } catch (e) { } }
    const data = list.slice(-30);
    if (data.length === 0) return;
    const map = { active: 3, calm: 2, weak: 1 }, lbl = { 3: '活跃', 2: '平静', 1: '偏弱' };
    App.charts.ls = new Chart(ctx, {
      type: 'line',
      data: {
        labels: data.map(r => r.date.slice(5)),
        datasets: [{ label: '链接状态', data: data.map(r => map[r.status] || 2), borderColor: '#9d92b8', backgroundColor: 'rgba(157,146,184,.12)', fill: true, tension: .35, pointRadius: 5, pointBackgroundColor: data.map(r => LinkStatus.color(r.status)) }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: { y: { min: .5, max: 3.5, ticks: { stepSize: 1, callback: v => lbl[v] || '' } }, x: { ticks: { font: { size: 10 } } } },
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: function (c) { const r = data[c.dataIndex]; return LinkStatus.label(r.status) + ((r.factors || []).length ? ' · ' + r.factors.slice(0, 3).join('、') : '') } } }
        }
      }
    });
  },
  fetchAndRender: async function () {
    const list = (await DB.getAll(STORES.linkStatus)).sort((a, b) => (a.date || '').localeCompare(b.date || ''));
    LinkStatus.renderChart(list);
  },
  monthly: async function () {
    const list = await DB.getAll(STORES.linkStatus);
    const today = Utils.today();
    const ym = today.slice(0, 7), yr = today.slice(0, 4);
    const mon = list.filter(r => (r.date || '').startsWith(ym)).sort((a, b) => a.date.localeCompare(b.date));
    const yearList = list.filter(r => (r.date || '').startsWith(yr));
    const cnt = { active: 0, calm: 0, weak: 0 }; mon.forEach(r => { if (cnt[r.status] !== undefined) cnt[r.status]++ });
    const yc = { active: 0, calm: 0, weak: 0 }; yearList.forEach(r => { if (yc[r.status] !== undefined) yc[r.status]++ });
    const yn = yc.active + yc.calm + yc.weak;
    let h = '<h3 style="margin-bottom:10px">' + ym + ' 链接状态复盘</h3>';
    h += '<div class="ls-d-row"><b>本月记录：</b>活跃 ' + cnt.active + ' 次 · 平静 ' + cnt.calm + ' 次 · 偏弱 ' + cnt.weak + ' 次（共 ' + mon.length + ' 天）</div>';
    h += '<div class="ls-d-row"><b>今年占比：</b>' + (yn > 0 ? '活跃 ' + Math.round(yc.active / yn * 100) + '% · 平静 ' + Math.round(yc.calm / yn * 100) + '% · 偏弱 ' + Math.round(yc.weak / yn * 100) + '%（共 ' + yn + ' 天）' : '今年暂无记录') + '</div>';
    if (mon.length === 0) { h += '<p class="text-muted" style="padding:20px 0">本月还没有记录，先去记录今天的链接状态吧。</p>'; Modal.open('月度链接状态分析', h); return }
    const byS = {}; mon.forEach(r => { (byS[r.status] = byS[r.status] || []).push(r) });
    function topFactors(arr) { const m = {}; arr.forEach(r => (r.factors || []).forEach(f => m[f] = (m[f] || 0) + 1)); return Object.entries(m).sort((a, b) => b[1] - a[1]).slice(0, 3) }
    const act = topFactors(byS.active || []), wkF = topFactors(byS.weak || []);
    h += '<div style="margin:14px 0 6px;font-weight:600">AI 链接状态分析</div>';
    h += '<div class="privacy-notice" style="line-height:1.9;font-size:13px">';
    h += '· 活跃状态出现时，你记录的共同因素：' + (act.length ? act.map(x => x[0] + '（' + x[1] + '次）').join('、') + '。' : '本月暂无活跃记录。') + '<br>';
    h += '· 偏弱状态出现时，你记录的共同因素：' + (wkF.length ? wkF.map(x => x[0] + '（' + x[1] + '次）').join('、') + '。' : '本月暂无偏弱记录。') + '<br>';
    let sleepLink = 0;
    (byS.weak || []).forEach(r => {
      const prev = list.find(x => x.date === Utils.fmtDate(new Date(new Date(r.date).getTime() - 86400000)));
      if (prev && (prev.factors || []).some(f => f === '熬夜' || f === '睡眠不足')) sleepLink++;
    });
    if (sleepLink > 0) h += '· 从你的记录来看，' + sleepLink + ' 次偏弱状态的前一天记录过熬夜或睡眠不足，可以继续观察二者是否存在稳定关联。<br>';
    h += '· 以上为基于你本人记录的观察方向，仅供自我探索参考，不构成任何确定性结论，也不用于判断链接是否真实存在。</div>';
    h += '<div class="chart-container-lg" style="height:240px;margin-top:12px"><canvas id="ls-mchart"></canvas></div>';
    Modal.open('月度链接状态分析', h, { footer: '<button class="btn btn-ghost" onclick="Modal.close()">关闭</button>' });
    setTimeout(function () {
      const ctx = document.getElementById('ls-mchart');
      if (!ctx) return;
      if (App.charts.lsm) { try { App.charts.lsm.destroy() } catch (e) { } }
      App.charts.lsm = new Chart(ctx, {
        type: 'line',
        data: { labels: mon.map(r => r.date.slice(5)), datasets: [{ data: mon.map(r => ({ active: 3, calm: 2, weak: 1 })[r.status] || 2), borderColor: '#9d92b8', backgroundColor: 'rgba(157,146,184,.12)', fill: true, tension: .35, pointBackgroundColor: mon.map(r => LinkStatus.color(r.status)) }] },
        options: { responsive: true, maintainAspectRatio: false, scales: { y: { min: .5, max: 3.5, ticks: { stepSize: 1, callback: v => ({ 3: '活跃', 2: '平静', 1: '偏弱' })[v] || '' } } }, plugins: { legend: { display: false } } }
      });
    }, 60);
  }
};
