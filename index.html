v><div class="item-sub">'+d.date+(d.starTitle?' · 想到「'+Utils.esc(d.starTitle)+'」':'')+'</div></div></div>').join('')||'<div class="text-muted text-sm">还没有星星日记。哪天想到某颗星星了，随手记一笔就好。</div>';document.getElementById('main').innerHTML='<div class="page-header"><div><h1>✦ 链接星图</h1><div class="subtitle">愿望记录 → 现实观察 → 情绪体验 → 长期复盘的私人星空</div></div><div class="flex gap-2"><button class="btn btn-secondary btn-sm" onclick="Modules.soul()">← 返回'+Utils.esc(App.settings.soulName)+'</button><button class="btn btn-secondary btn-sm" onclick="StarMap.diary()"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg> 星星日记</button><button class="btn btn-secondary btn-sm" onclick="StarMap.review()"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6"/><rect x="12" y="8" width="3" height="10"/><rect x="17" y="14" width="3" height="4"/></svg> 星图回顾</button><button class="btn btn-primary btn-sm" onclick="StarMap.showForm()">＋ 新增一颗星星</button></div></div><div class="privacy-notice mb-4">此页面为隐私空间，只做愿望记录与现实观察，不预测未来、不判定愿望一定会实现。</div><div class="starmap-wrap mb-4"><div class="starmap-moon"></div><div class="starmap-topbar"><span>'+sky.length+' 颗星星在天空 · 宝物袋 '+bag.length+' 件</span></div>'+skyHtml+'<div class="starmap-legend"><span>'+StarMap.STATUS.waiting.icon+' 等待观察</span><span>'+StarMap.STATUS.partial.icon+' 部分对应</span><span>'+StarMap.STATUS.realized.icon+' 已实现</span><span style="opacity:.55">'+StarMap.STATUS.none.icon+' 暂未发生</span><span style="opacity:.55">'+StarMap.STATUS.closed.icon+' 已入收藏区</span></div></div><div class="grid grid-2"><div class="card"><div class="card-title"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v9h14v-9M12 8v13"/><path d="M12 8c-2.5 0-5-1-5-3.2S10 2 12 5c2-3 5-3 5-.8S14.5 8 12 8z"/></svg> 宝物袋（已摘下的星星）</div>'+bagHtml+'</div><div class="card"><div class="card-title"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg> 星星日记</div>'+diaryHtml+'</div></div>'+(closedHtml?'<div class="card mt-4"><div class="card-title"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5.5"/><ellipse cx="12" cy="12" rx="10" ry="3.5" transform="rotate(-18 12 12)"/></svg> 收藏区（不再期待）</div>'+closedHtml+'</div>':'')},
showForm(){Modal.open('新增一颗星星','<div class="form-group"><label>愿望标题</label><input type="text" id="sm-title" placeholder="例如：希望有一天现实中有人送我一朵花"></div><div class="form-group"><label>愿望详细描述</label><textarea id="sm-desc" rows="4" placeholder="我为什么想体验这件事 / 这个愿望对我的意义 / 我期待的感觉 / 我脑海中的画面…"></textarea></div><div class="form-row"><div class="form-group"><label>愿望分类</label><select id="sm-cat">'+StarMap.CATS.map(c=>'<option value="'+c+'">'+c+'</option>').join('')+'</select></div><div class="form-group"><label>重要程度（决定星星大小）</label><select id="sm-imp"><option value="1">1 · 随手一许</option><option value="2">2 · 有点在意</option><option value="3" selected>3 · 普通</option><option value="4">4 · 很在意</option><option value="5">5 · 非常重要</option></select></div></div><div class="text-muted text-sm">创建日期将自动记录。星图只帮助保存愿望并观察现实，不预测未来。</div>',{footer:'<button class="btn btn-ghost" onclick="Modal.close()">取消</button><button class="btn btn-primary" onclick="StarMap.save()">许下这颗星星</button>'})},
async save(){const title=document.getElementById('sm-title').value.trim();if(!title){Toast.error('请输入愿望标题');return}await DB.put(STORES.stars,{id:Utils.uid(),kind:'wish',title,desc:document.getElementById('sm-desc').value,category:document.getElementById('sm-cat').value,importance:parseInt(document.getElementById('sm-imp').value)||3,status:'waiting',pickedAt:null,events:[],createdAt:Utils.now()});Modal.close();Toast.success('一颗新的星星升上了天空 ✦');StarMap.view()},
async viewStar(id){const s=await DB.get(STORES.stars,id);if(!s||s.kind==='diary')return;const st=StarMap.STATUS[s.status]||StarMap.STATUS.waiting;const rel=(await DB.getAll(STORES.soulRecords)).filter(r=>r.starId===id);const ev=s.events||[];let h='<div class="grid grid-2 mb-4"><div class="card"><div class="text-sm text-muted">愿望</div><div style="font-weight:600">'+Utils.esc(s.title)+'</div><div class="text-sm text-muted mt-2">分类：'+Utils.esc(s.category||'未分类')+' · 重要度 '+(s.importance||3)+'/5</div><div class="text-sm text-muted">创建于 '+Utils.fmtDate(s.createdAt)+(s.pickedAt?' · 摘星于 '+Utils.fmtDate(s.pickedAt):'')+'</div>'+(s.desc?'<div class="text-sm mt-2" style="white-space:pre-wrap">'+Utils.esc(s.desc)+'</div>':'')+'</div><div class="card"><div class="text-sm text-muted">当前状态</div><div style="font-weight:600;margin:4px 0">'+st.icon+' '+st.label+'</div><select id="sm-status" style="width:100%;padding:6px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-input)">'+Object.keys(StarMap.STATUS).map(k=>'<option value="'+k+'" '+(k===s.status?'selected':'')+'>'+StarMap.STATUS[k].icon+' '+StarMap.STATUS[k].label+'</option>').join('')+'</select><button class="btn btn-secondary btn-sm mt-2" onclick="StarMap.setStatus(\''+s.id+'\')">更新状态</button></div></div>';h+='<div class="card mb-4" style="padding:14px"><div class="flex gap-2" style="align-items:center;justify-content:space-between;margin-bottom:8px"><b>后续事件记录（'+ev.length+'）</b><button class="btn btn-secondary btn-sm" onclick="StarMap.addEvent(\''+s.id+'\')">＋ 添加后续事件</button></div>'+(ev.length?ev.slice().reverse().map(e=>'<div class="timeline-item"><div class="item-title" style="font-size:13px">'+Utils.fmtDate(e.date)+' · '+Utils.esc(e.what)+'</div><div class="item-sub" style="white-space:pre-wrap">实际情况：'+Utils.esc(e.actual||'—')+'\n我的感受：'+Utils.esc(e.feeling||'—')+'\n是否与愿望有关（我的理解）：'+Utils.esc(e.related||'未填写')+'</div></div>').join(''):'<div class="text-muted text-sm">还没有记录到相关现实事件</div>')+'<div class="text-muted text-sm mt-2" style="line-height:1.6">注：这里区分「实际发生 / 我的感受 / 我的理解」，不会自动把事件判定为愿望实现。</div></div>';if(rel.length)h+='<div class="card mb-4" style="padding:14px"><b class="text-sm">关联的'+Utils.esc(App.settings.soulName)+'记录（'+rel.length+'）</b>'+rel.slice(0,5).map(r=>'<div class="list-item"><div class="item-main"><div class="item-title" style="font-size:13px">'+Utils.esc(r.title)+'</div><div class="item-sub">'+r.date+' · '+Utils.esc(r.recordType)+'</div></div></div>').join('')+'</div>';h+='<div class="flex gap-2">'+(s.pickedAt?'<button class="btn btn-secondary" onclick="StarMap.unpick(\''+s.id+'\')">放回天空</button>':'<button class="btn btn-secondary" onclick="StarMap.pick(\''+s.id+'\')"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5S4 15 4 9.5C4 6.5 6.5 5 8.5 5c1.5 0 2.8.8 3.5 2 .7-1.2 2-2 3.5-2 2 0 4.5 1.5 4.5 4.5 0 5.5-8 11-8 11z"/></svg> 摘下这颗星（放入宝物袋）</button>')+'<button class="btn btn-ghost" style="color:var(--danger)" onclick="StarMap.del(\''+s.id+'\')">删除</button></div>';Modal.open('星星详情',h,{size:'lg'})},
async setStatus(id){const s=await DB.get(STORES.stars,id);if(!s)return;const ns=document.getElementById('sm-status').value;s.status=ns;await DB.put(STORES.stars,s);Toast.success('状态已更新');StarMap.view();if(ns==='realized'&&!s.pickedAt){StarMap.askEmotion(s)}else{StarMap.viewStar(id)}},
askEmotion(s){Modal.open('同步到情绪曲线？','<div class="text-sm" style="line-height:1.8">这颗星星被标记为「已实现」，它带给你一些情绪了吗？<br>要不要在情绪曲线里记一条开心的情绪？</div>',{footer:'<button class="btn btn-ghost" onclick="Modal.close()">不用了</button><button class="btn btn-primary" onclick="StarMap.syncEmotion(\''+s.id+'\')">记录开心情绪</button>'})},
async syncEmotion(id){const s=await DB.get(STORES.stars,id);const now=new Date();if(s)await DB.put(STORES.emotions,{id:Utils.uid(),type:'开心',intensity:8,event:'星星实现：'+s.title,people:'',thought:'',body:'',reaction:'',need:'',relieved:true,extra:'',date:Utils.today(),time:String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'),createdAt:Utils.now()});Modal.close();Toast.success('已同步到情绪曲线');StarMap.view()},
addEvent(id){Modal.open('添加后续事件','<div class="form-group"><label>日期</label><input type="date" id="se-date" value="'+Utils.today()+'"></div><div class="form-group"><label>发生了什么</label><textarea id="se-what" rows="2" placeholder="客观描述出现的相关事件"></textarea></div><div class="form-group"><label>实际情况（可确认的部分）</label><textarea id="se-actual" rows="2" placeholder="与感受区分开，只写能确认的"></textarea></div><div class="form-group"><label>我的感受</label><textarea id="se-feeling" rows="2" placeholder="当时的情绪与体验"></textarea></div><div class="form-group"><label>是否认为与这个愿望有关（我的理解）</label><select id="se-related"><option value="是">是</option><option value="部分相关">部分相关</option><option value="不确定">不确定</option><option value="否">否</option></select></div>',{footer:'<button class="btn btn-ghost" onclick="Modal.close()">取消</button><button class="btn btn-primary" onclick="StarMap.saveEvent(\''+id+'\')">保存</button>'})},
async saveEvent(id){const s=await DB.get(STORES.stars,id);if(!s)return;const what=document.getElementById('se-what').value.trim();if(!what){Toast.error('请填写发生了什么');return}s.events=s.events||[];s.events.push({date:document.getElementById('se-date').value,what,actual:document.getElementById('se-actual').value,feeling:document.getElementById('se-feeling').value,related:document.getElementById('se-related').value});if(s.status==='waiting')s.status='partial';await DB.put(STORES.stars,s);Modal.close();Toast.success('事件已记录（不会自动判定为实现）');StarMap.viewStar(id);StarMap.view()},
pick(id){Modal.confirm('确定摘下这颗星星吗？它将从天空消失并进入宝物袋（之后可放回）。',async()=>{const s=await DB.get(STORES.stars,id);if(!s)return;s.pickedAt=Utils.now();await DB.put(STORES.stars,s);Modal.close();Toast.success('已放入宝物袋');StarMap.view()})},
async unpick(id){const s=await DB.get(STORES.stars,id);if(!s)return;s.pickedAt=null;await DB.put(STORES.stars,s);Toast.success('已放回天空');StarMap.viewStar(id);StarMap.view()},
del(id){Modal.confirm('确定永久删除这颗星星及其全部记录吗？',async()=>{await DB.del(STORES.stars,id);Modal.close();Toast.success('已删除');StarMap.view()})},
async diary(){const stars=(await StarMap.wishes()).filter(s=>!s.pickedAt&&s.status!=='closed');const d=Utils.today();const old=(await StarMap.all()).find(x=>x.kind==='diary'&&x.date===d);Modal.open('星星日记 · '+d,'<div class="text-muted text-sm mb-2" style="line-height:1.7">今天有没有什么事情让你想到某颗星星？轻轻记一笔就好，不用强迫每天记录。</div><div class="form-group"><label>想到哪颗星星（可选）</label><select id="sd-star"><option value="">不指定</option>'+stars.map(x=>'<option value="'+x.id+'" '+((old&&old.starId===x.id)?'selected':'')+'>'+Utils.esc(x.title)+'</option>').join('')+'</select></div><div class="form-group"><label>今天想到的</label><textarea id="sd-content" rows="3" placeholder="今天发生了什么，让我想起了某颗星星…">'+(old?Utils.esc(old.content):'')+'</textarea></div>',{footer:'<button class="btn btn-ghost" onclick="Modal.close()">取消</button><button class="btn btn-primary" onclick="StarMap.saveDiary()">保存</button>'})},
async saveDiary(){const content=document.getElementById('sd-content').value.trim();if(!content){Toast.error('写点什么吧');return}const starId=document.getElementById('sd-star').value||null;let starTitle='';if(starId){const st=await DB.get(STORES.stars,starId);starTitle=st?st.title:''}const d=Utils.today();const old=(await StarMap.all()).find(x=>x.kind==='diary'&&x.date===d);await DB.put(STORES.stars,{id:old?old.id:('sd-'+d),kind:'diary',date:d,content,starId,starTitle,createdAt:old?old.createdAt:Utils.now()});Modal.close();Toast.success('星星日记已保存');StarMap.view()},
async review(){const now=new Date();const ym=Utils.fmtDate(now).slice(0,7);const all=await StarMap.wishes();const month=all.filter(s=>(s.createdAt||'').slice(0,7)===ym);const cnt={realized:0,partial:0,waiting:0,none:0,closed:0};month.forEach(s=>{if(cnt[s.status]!==undefined)cnt[s.status]++});const realized=all.filter(s=>s.status==='realized');const catCnt={};all.forEach(s=>{if(s.pickedAt)return;if(s.category)catCnt[s.category]=(catCnt[s.category]||0)+1});const topCat=Object.entries(catCnt).sort((a,b)=>b[1]-a[1])[0];let cycles=[];all.forEach(s=>{(s.events||[]).forEach(e=>{if(!e.date)return;const dd=Utils.daysBetween(Utils.fmtDate(s.createdAt),e.date);if(dd!==null&&dd!==undefined&&dd>=0)cycles.push(dd)})});const avgCycle=cycles.length?Math.round(cycles.reduce((a,b)=>a+b,0)/cycles.length):null;let h='<h3 style="margin-bottom:10px">'+ym.slice(0,4)+'年'+parseInt(ym.slice(5))+'月 链接星图回顾</h3>';h+='<div class="grid grid-4 mb-4"><div class="stat-card"><div class="stat-value">'+month.length+'</div><div class="stat-label">本月新增愿望</div></div><div class="stat-card"><div class="stat-value">'+cnt.realized+'</div><div class="stat-label">已实现</div></div><div class="stat-card"><div class="stat-value">'+cnt.partial+'</div><div class="stat-label">部分对应</div></div><div class="stat-card"><div class="stat-value">'+(cnt.waiting+cnt.none)+'</div><div class="stat-label">等待观察/暂未发生</div></div></div>';if(topCat)h+='<div class="card mb-4" style="padding:14px"><b class="text-sm">最常出现的愿望主题</b><div class="text-sm text-muted mt-1" style="line-height:1.7">你在星空中最常许下的是「'+Utils.esc(topCat[0])+'」类愿望（'+topCat[1]+'颗）。从记录来看，你近期比较关注'+(topCat[0]==='互动愿望'?'现实互动与交流':topCat[0]==='日常小显化'?'生活中的小巧合与信号':topCat[0]==='关系成长愿望'?'关系的共同成长与了解':'自己的内在稳定与安全感')+'。</div></div>';if(realized.length){h+='<div class="card mb-4" style="padding:14px"><b class="text-sm">已实现愿望回顾</b>'+realized.map(s=>{const fe=(s.events||[])[0];return '<div class="list-item"><div class="item-main"><div class="item-title" style="font-size:13px">'+StarMap.STATUS.realized.icon+' '+Utils.esc(s.title)+'</div><div class="item-sub">许愿 '+Utils.fmtDate(s.createdAt)+(fe?' · 首次对应事件 '+fe.date:'')+'</div></div></div>'}).join('')+'</div>'}h+='<div class="card mb-4" style="padding:14px"><b class="text-sm">愿望实现周期</b><div class="text-sm text-muted mt-1">'+(avgCycle!==null?'从许愿到记录第一个相关事件，平均经过 '+avgCycle+' 天。':'还没有足够的「愿望 → 现实事件」配对来计算周期，继续观察吧。')+'</div></div>';h+='<div class="card mb-4" style="padding:14px"><b class="text-sm">愿望模式（AI 分析）</b><div class="text-sm text-muted mt-1" style="line-height:1.8">'+(all.length?'目前天空中有 '+all.filter(s=>!s.pickedAt&&s.status!=='closed').length+' 颗星星、宝物袋 '+all.filter(s=>s.pickedAt).length+' 件宝物。可以继续观察自己真正想要的体验是什么：哪些愿望在现实中出现了对应，哪些没有，你的关注点是否发生了变化。':'星图还是空的，先许下第一颗星星吧。')+'</div><div class="ai-notice mt-2">以上为 AI 根据星图记录本地生成的观察与推测，仅供参考，不构成对未来的预测，不代表愿望一定会实现。</div></div>';Modal.open('星图回顾',h,{size:'lg'})}
};

tags(id){const el=document.getElementById(id);if(!el)return[];return[...el.querySelectorAll('.ls-tag.on')].map(x=>x.textContent)},
tagGroup(id,items,sel){return'<div class="dm-tags-wrap" id="'+id+'">'+items.map(i=>'<span class="ls-tag'+((sel||[]).includes(i)?' on':'')+'" onclick="this.classList.toggle(\'on\')">'+i+'</span>').join('')+'</div>'},
row(l,v){return v?'<div class="dm-row"><b>'+l+'</b><div style="flex:1;white-space:pre-wrap">'+Utils.esc(v)+'</div></div>':''},

const date=dt.slice(0,10);
const bed=document.getElementById('df-bed').value;let dur=document.getElementById('df-dur').value.trim();

Inspiration._keep={content:document.getElementById('in-content').value,cat:'',source:document.getElementById('in-source').value,date:document.getElementById('in-date').value};
const sel=document.getElementById('in-cat');Inspiration._keep.cat=sel.selectedIndex>=0&&sel.options[sel.selectedIndex].value!=='__custom__'?sel.value:'';
Modal.open('新增自定义分类','<div class="form-group"><label>分类名称</label><input type="text" id="ic-name" placeholder="如：视频脚本 / 塔罗牌阵 / 房间改造" onkeydown="if(event.key===\'Enter\')Inspiration.saveCat()"></div>',{footer:'<button class="btn btn-ghost" onclick="Inspiration.backToForm()">返回</button><button class="btn btn-primary" onclick="Inspiration.saveCat()">保存并使用</button>'});
setTimeout(()=>{const el=document.getElementById('ic-name');if(el)el.focus()},100);
},
backToForm(){const k=Inspiration._keep;Inspiration._keep=null;Inspiration.showForm();setTimeout(()=>{if(!k)return;const c=document.getElementById('in-content'),s=document.getElementById('in-source'),d=document.getElementById('in-date');if(c)c.value=k.content;if(s)s.value=k.source;if(d)d.value=k.date},50)},
saveCat(){
const v=document.getElementById('ic-name').value.trim();
if(!v){Toast.error('先写一个分类名');return}
const cats=Inspiration.cats();
if(cats.includes(v)){Toast.error('这个分类已存在')}
else{cats.push(v);App.settings.inspirationCats=cats;Store.setSettings(App.settings);Toast.success('分类已添加')}
Inspiration._keep.cat=v;const k=Inspiration._keep;Inspiration._keep=null;
Inspiration.showForm();
setTimeout(()=>{const c=document.getElementById('in-content'),s=document.getElementById('in-source'),d=document.getElementById('in-date');if(c)c.value=k.content;if(s)s.value=k.source;if(d)d.value=k.date},50);
},
async save(){
const content=document.getElementById('in-content').value.trim();
if(!content){Toast.error('灵感内容还空着');return}
const id=Inspiration._editId||Utils.uid();
Inspiration._editId=null;
await DB.put(STORES.inspirations,{id,date:document.getElementById('in-date').value||Utils.today(),content,category:document.getElementById('in-cat').value,source:document.getElementById('in-source').value.trim(),createdAt:Utils.now()});
Modal.close();Toast.success('灵感已接住 ✦');
if(App.currentModule==='inspiration')Modules.inspiration();
},
async del(id){
Modal.confirm('确定删除这条灵感吗？',async()=>{await DB.del(STORES.inspirations,id);Toast.success('已删除');if(App.currentModule==='inspiration')Modules.inspiration()});
},
async random(){
const list=await Inspiration.all();
if(!list.length){Toast.info('还没有灵感可以抽');return}
const d=list[Math.floor(Math.random()*list.length)];
Modal.open('✦ 此刻的灵感','<div class="dm-note" style="font-size:15px;line-height:1.8">'+Utils.esc(d.content)+'</div>'+Dreams.row('日期',d.date)+Dreams.row('分类',d.category)+Dreams.row('来源',d.source),{footer:'<button class="btn btn-ghost" onclick="Modal.close()">关闭</button><button class="btn btn-primary" onclick="Inspiration.random()">再抽一条</button>'});
},
manageCats(){
const cats=Inspiration.cats();
Modal.open('管理灵感分类','<div class="dm-mini" style="margin-bottom:10px">删除分类不会删除已保存的灵感，只是从列表里移除这个选项。</div>'+cats.map((c,i)=>'<div class="dm-sign-top"><span>'+Utils.esc(c)+'</span><button class="btn-icon btn-ghost" onclick="Inspiration.delCat('+i+')">✕</button></div>').join('')+'<div class="form-group" style="margin-top:12px"><input type="text" id="mc-name" placeholder="新分类名称" onkeydown="if(event.key===\'Enter\')Inspiration.addCat()"></div><button class="btn btn-primary" onclick="Inspiration.addCat()">添加</button>',{});
},
addCat(){
const v=document.getElementById('mc-name').value.trim();if(!v){Toast.error('先写一个分类名');return}
const cats=Inspiration.cats();if(cats.includes(v)){Toast.error('已存在');return}
cats.push(v);App.settings.inspirationCats=cats;Store.setSettings(App.settings);Toast.success('已添加');Inspiration.manageCats();
},
delCat(i){
App.settings.inspirationCats.splice(i,1);Store.setSettings(App.settings);Inspiration.manageCats();
if(App.currentModule==='inspiration')setTimeout(()=>Modules.inspiration(),50);
}
};
Modules.inspiration=async function(){Inspiration.render()};
/* ===== Init ===== */
(async function(){await DB.init();await App.init()})();
</script>
</body>
</html>
