<script>
/* ===== 灵魂链接工作台 JS - Part 1: Core ===== */
const DB_NAME='SoulLinkWorkstation_DB',DB_VERSION=6,SETTINGS_KEY='soul_link_settings',TIMER_KEY='soul_link_active_timer';
const STORES={tasks:'tasks',timerRecords:'timerRecords',projects:'projects',knowledge:'knowledge',appointments:'appointments',learning:'learning',learningLogs:'learningLogs',transactions:'transactions',emotions:'emotions',reviews:'reviews',soulRecords:'soulRecords',soulProfiles:'soulProfiles',wordCards:'wordCards',wordCardDecks:'wordCardDecks',drawRecords:'drawRecords',reminders:'reminders',images:'images',backups:'backups',dailyReset:'dailyReset',linkStatus:'linkStatus',stars:'stars',dreams:'dreams',dreamSigns:'dreamSigns',inspirations:'inspirations',aiConnections:'aiConnections',aiResources:'aiResources',aiConversations:'aiConversations',aiMessages:'aiMessages',aiMemories:'aiMemories',relations:'relations',auditLog:'auditLog'};

Modules.finance=async function(){const tx=(await DB.getAll(STORES.transactions)).sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt.localeCompare(a.createdAt));Finance._all=tx;const now=new Date();const today=Utils.today();const ym=today.slice(0,7);const year=today.slice(0,4);const wsStr=Utils.fmtDate(Utils.weekStart());const per=Finance._period||'month';let range=[],label='本月';if(per==='day'){range=tx.filter(t=>t.date===today);label='今日'}else if(per==='week'){range=tx.filter(t=>t.date>=wsStr);label='本周'}else if(per==='year'){range=tx.filter(t=>t.date.startsWith(year));label='全年'}else if(per==='all'){range=tx;label='全部'}else{range=tx.filter(t=>t.date.startsWith(ym));label='本月'}

const months=[];let cum=0;for(let m=1;m<=12;m++){const mk=year+'-'+String(m).padStart(2,'0');const mi=tx.filter(t=>t.date.startsWith(mk)).filter(t=>t.type==='收入').reduce((s2,t)=>s2+t.amount,0);const me=tx.filter(t=>t.date.startsWith(mk)).filter(t=>t.type==='支出').reduce((s2,t)=>s2+t.amount,0);cum+=mi-me;months.push({m,inc:mi,exp:me,bal:mi-me,cum})}

Finance.setPeriod=function(p){Finance._period=p;Modules.finance()};
Finance.filterList=function(){const el=document.getElementById('ff-list');if(!el)return;const from=document.getElementById('ff-from').value;const to=document.getElementById('ff-to').value;const cat=document.getElementById('ff-cat').value;const type=document.getElementById('ff-type').value;const q=document.getElementById('ff-q').value.trim().toLowerCase();let list=(Finance._all||[]);if(from)list=list.filter(t=>t.date>=from);if(to)list=list.filter(t=>t.date<=to);if(cat)list=list.filter(t=>t.category===cat);if(type)list=list.filter(t=>t.type===type);if(q)list=list.filter(t=>((t.note||'')+(t.category||'')).toLowerCase().includes(q));el.innerHTML=list.slice(0,200).map(t=>'<div class="list-item"><span class="nav-icon">'+(t.type==='收入'?'↑':'↓')+'</span><div class="item-main"><div class="item-title">'+Utils.esc(t.category||'')+(t.note?' · '+Utils.esc(t.note):'')+'</div><div class="item-sub">'+t.date+(t.subCategory?' · '+Utils.esc(t.subCategory):'')+'</div></div><div style="font-weight:600;color:'+(t.type==='支出'?'var(--danger)':'var(--success)')+'">'+(t.type==='支出'?'-':'+')+Utils.money(t.amount)+'</div><button class="btn-icon btn-ghost" onclick="Finance.del(\''+t.id+'\')">✕</button></div>').join('')||'<div class="text-muted text-sm" style="padding:8px">没有符合条件的账目</div>'};
Finance.renderCharts=function(expCats,months){if(typeof Chart==='undefined'){return}const pie=document.getElementById('fin-pie');if(pie){const entries=Object.entries(expCats).sort((a,b)=>b[1]-a[1]).slice(0,8);if(App.charts.finPie)App.charts.finPie.destroy();App.charts.finPie=new Chart(pie,{type:'doughnut',data:{labels:entries.map(e=>e[0]),datasets:[{data:entries.map(e=>e[1]),backgroundColor:['#4a4f57','#6e747d','#9aa0a8','#b9bec5','#d4d8dc','#8f959e','#c6cad0','#5f646c'],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{color:'#5f646c',boxWidth:12,font:{size:11}}}}}})}const tr=document.getElementById('fin-trend');if(tr){if(App.charts.finTrend)App.charts.finTrend.destroy();App.charts.finTrend=new Chart(tr,{type:'line',data:{labels:months.map(m=>m.m+'月'),datasets:[{label:'收入',data:months.map(m=>m.inc),borderColor:'#8fb3a0',backgroundColor:'rgba(143,179,160,.12)',tension:.35},{label:'支出',data:months.map(m=>m.exp),borderColor:'#cf9aa0',backgroundColor:'rgba(207,154,160,.12)',tension:.35},{label:'累计结余',data:months.map(m=>m.cum),borderColor:'#4a4f57',backgroundColor:'rgba(74,79,87,.08)',fill:true,tension:.35}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#5f646c',boxWidth:12,font:{size:11}}}},scales:{x:{ticks:{color:'#9aa0a8',font:{size:10}}},y:{ticks:{color:'#9aa0a8',font:{size:10}}}}}})}};

Finance.showForm=function(){const ec=App.settings.expenseCats||[];const ic=App.settings.incomeCats||[];Modal.open('记一笔','<div class="form-row"><div class="form-group"><label>类型</label><select id="f-type" onchange="Finance.updateCats()"><option value="支出">支出</option><option value="收入">收入</option></select></div><div class="form-group"><label>金额</label><input type="number" id="f-amount" placeholder="0.00" step="0.01"></div></div><div class="form-group"><label>分类</label><select id="f-category"></select></div><div class="form-group" id="f-sub-wrap" style="display:none"><label>二级分类</label><select id="f-subcategory">'+(App.settings.shoppingSubCats||[]).map(s=>'<option>'+s+'</option>').join('')+'</select></div><div class="form-row"><div class="form-group"><label>日期</label><input type="date" id="f-date" value="'+Utils.today()+'"></div><div class="form-group"><label>备注</label><input type="text" id="f-note" placeholder="可选"></div></div>',{footer:'<button class="btn btn-ghost" onclick="Modal.close()">取消</button><button class="btn btn-primary" onclick="Finance.save()">保存</button>'});Finance.updateCats()};
Finance.updateCats=function(){const type=document.getElementById('f-type').value;const sel=document.getElementById('f-category');const wrap=document.getElementById('f-sub-wrap');let cats=[];if(type==='支出'){cats=App.settings.expenseCats||[]}else if(type==='收入'){cats=App.settings.incomeCats||[]}else{cats=App.settings.incomeCats||[]}sel.innerHTML=cats.map(c=>'<option value="'+c+'">'+c+'</option>').join('')+'<option value="__custom__">＋ 自定义分类…</option>';wrap.style.display=type==='支出'&&sel.value==='购物'?'block':'none';sel.onchange=()=>{if(sel.value==='__custom__'){Finance.customCat(type);return}wrap.style.display=type==='支出'&&sel.value==='购物'?'block':'none'}};
Finance.customCat=function(type){Finance._catType=type;Finance._keep={type:document.getElementById('f-type').value,amount:document.getElementById('f-amount').value,date:document.getElementById('f-date').value,note:document.getElementById('f-note').value};Modal.open('新增自定义'+type+'分类','<div class="form-group"><label>分类名称</label><input type="text" id="f-newcat" placeholder="输入新的'+type+'分类名称，保存后可直接选用"></div><div class="text-muted text-sm" style="margin-bottom:10px">保存后将永久加入'+type+'分类选项，统计与图表中同样生效。</div>',{footer:'<button class="btn btn-ghost" onclick="Finance.showForm()">取消</button><button class="btn btn-primary" onclick="Finance.saveCat()">保存</button>'})};
Finance.saveCat=function(){const name=document.getElementById('f-newcat').value.trim();if(!name){Toast.error('请输入分类名称');return}const type=Finance._catType||'支出';const key=type==='收入'?'incomeCats':'expenseCats';const cats=App.settings[key]||[];if(cats.includes(name)){Toast.error('该分类已存在');return}cats.push(name);App.settings[key]=cats;Store.setSettings(App.settings);Toast.success('自定义分类「'+name+'」已保存');const k=Finance._keep||{};Finance.showForm();setTimeout(function(){const tEl=document.getElementById('f-type');if(!tEl)return;if(k.type)tEl.value=k.type;Finance.updateCats();const sel=document.getElementById('f-category');if(sel){for(var i=0;i<sel.options.length;i++){if(sel.options[i].value===name){sel.value=name;break}}}if(k.amount)document.getElementById('f-amount').value=k.amount;if(k.date)document.getElementById('f-date').value=k.date;if(k.note)document.getElementById('f-note').value=k.note},60)};

Finance.save=async function(){const amt=parseFloat(document.getElementById('f-amount').value);if(!amt||amt<=0){Toast.error('请输入有效金额');return}const type=document.getElementById('f-type').value;const data={id:Utils.uid(),type,amount:amt,category:document.getElementById('f-category').value,subCategory:type==='支出'&&document.getElementById('f-category').value==='购物'?document.getElementById('f-subcategory').value:null,date:document.getElementById('f-date').value,note:document.getElementById('f-note').value,createdAt:Utils.now()};await DB.put(STORES.transactions,data);Modal.close();Toast.success('已记录');Modules.finance()};
Finance.del=async function(id){Modal.confirm('确定删除这条记录吗？',async()=>{await DB.del(STORES.transactions,id);Toast.success('已删除');Modules.finance()})};

Modules.emotions=async function(){const all=(await DB.getAll(STORES.emotions)).sort((a,b)=>b.date.localeCompare(a.date)||b.time.localeCompare(a.time));const today=Utils.today();const te=all.filter(e=>e.date===today);document.getElementById('main').innerHTML='<div class="page-header"><div><h1><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="7.5" r="3"/><path d="M8 2v1.2M2 7.5h1.2"/><path d="M17.5 11.5a4.5 4.5 0 1 0 0 9H8a4.5 4.5 0 1 0 .8-8.9"/></svg> 情绪天气监测</h1><div class="subtitle">观察情绪的变化，就像观察天气</div></div><button class="btn btn-primary" onclick="Emotions.showForm()">+ 记录情绪</button></div><div class="card mb-4"><div class="card-title"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M6 14l4-4 3 3 6-7"/><path d="M15 6h4v4"/></svg> 今日情绪曲线</div><div class="chart-container-lg"><canvas id="emotion-chart"></canvas></div>'+(te.length===0?'<div class="text-muted text-sm mt-2"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.8.6 1.5 1.6 1.5 2.6h4c0-1 .7-2 1.5-2.6A6 6 0 0 0 12 3z"/></svg> 默认状态为「平和」（系统默认），尚未主动记录</div>':'')+'</div><div class="grid grid-3 mb-4"><div class="stat-card"><div class="stat-icon"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h9l5 5v13H5z"/><path d="M14 3v5h5M8 12h8M8 16h5"/></svg></div><div class="stat-value">'+te.length+'</div><div class="stat-label">今日记录次数</div></div><div class="stat-card"><div class="stat-icon"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6"/><rect x="12" y="8" width="3" height="10"/><rect x="17" y="14" width="3" height="4"/></svg></div><div class="stat-value">'+(te.length>0?te[0].type:'平和')+'</div><div class="stat-label">最近情绪</div></div><div class="stat-card"><div class="stat-icon"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h4"/></svg></div><div class="stat-value">'+(te.length>0?(te.reduce((s,e)=>s+e.intensity,0)/te.length).toFixed(1):'-')+'</div><div class="stat-label">平均强度</div></div></div><div class="card"><div class="card-title"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3h10a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6"/><path d="M6 21a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h2"/><path d="M9 8h6M9 12h6"/></svg> 情绪记录</div><div style="max-height:400px;overflow-y:auto">'+(all.slice(0,50).map(e=>'<div class="list-item"><span class="nav-icon">'+(Emotions.types.find(t=>t.name===e.type)?.icon||'<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="7.5" r="3"/><path d="M8 2v1.2M2 7.5h1.2"/><path d="M17.5 11.5a4.5 4.5 0 1 0 0 9H8a4.5 4.5 0 1 0 .8-8.9"/></svg>')+'</span><div class="item-main"><div class="item-title">'+Utils.esc(e.type)+' ('+e.intensity+'/10)</div><div class="item-sub">'+e.date+' '+e.time+(e.event?' · '+Utils.esc(e.event):'')+'</div></div><button class="btn-icon btn-ghost" onclick="Emotions.view(\''+e.id+'\')"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg></button></div>').join('')||'<div class="text-muted text-sm" style="padding:8px">暂无记录</div>')+'</div></div>';if(te.length>0){Emotions.renderChart(te)}else{Emotions.renderDefaultChart()}};
Emotions.renderChart=function(data){const ctx=document.getElementById('emotion-chart');if(!ctx)return;const labels=data.map(e=>e.time);const intensities=data.map(e=>e.intensity);const colors=data.map(e=>{const t=Emotions.types.find(t=>t.name===e.type);return t?t.color:'#a8d8d8'});if(App.charts.emotion)App.charts.emotion.destroy();App.charts.emotion=new Chart(ctx,{type:'line',data:{labels:labels.length>0?labels:['默认'],datasets:[{label:'情绪强度',data:intensities.length>0?intensities:[5],borderColor:'#8f959d',backgroundColor:'rgba(217,123,142,.1)',fill:true,tension:.4,pointBackgroundColor:colors,pointRadius:6}]},options:{responsive:true,maintainAspectRatio:false,scales:{y:{min:0,max:10,ticks:{stepSize:2}},x:{ticks:{font:{size:10}}}},plugins:{legend:{display:false},tooltip:{callbacks:{label:function(ctx){const e=data[ctx.dataIndex];return e?e.type+': '+e.intensity+'/10':''}}}}}})};
Emotions.renderDefaultChart=function(){const ctx=document.getElementById('emotion-chart');if(!ctx)return;if(App.charts.emotion)App.charts.emotion.destroy();App.charts.emotion=new Chart(ctx,{type:'line',data:{labels:['00:00','06:00','12:00','18:00','24:00'],datasets:[{label:'情绪强度(系统默认)',data:[5,5,5,5,5],borderColor:'#a8d8d8',backgroundColor:'rgba(168,216,216,.1)',fill:true,tension:.4,borderDash:[5,5]}]},options:{responsive:true,maintainAspectRatio:false,scales:{y:{min:0,max:10}},plugins:{legend:{display:false}}}})};
Emotions.showForm=function(){Modal.open('记录情绪','<div class="form-group"><label>情绪类型</label><div style="display:flex;flex-wrap:wrap;gap:6px" id="emo-select">'+Emotions.types.map(t=>'<div class="emotion-btn" data-emo="'+t.name+'" onclick="Emotions.selectEmo(this)"><div class="emo-icon">'+t.icon+'</div><div class="emo-label">'+t.name+'</div></div>').join('')+'</div></div><div class="form-group"><label>情绪强度 (1-10)</label><input type="range" id="e-intensity" min="1" max="10" value="5" oninput="document.getElementById(\'e-int-val\').textContent=this.value"><div style="display:flex;justify-content:space-between"><span>1</span><span style="font-weight:600;color:var(--primary)" id="e-int-val">5</span><span>10</span></div></div><div class="form-group"><label>发生了什么</label><textarea id="e-event" placeholder="描述事件..."></textarea></div><div class="form-group"><label>涉及的人或事</label><input type="text" id="e-people" placeholder="可选"></div><div class="form-group"><label>自动出现的想法</label><textarea id="e-thought" placeholder="当时脑海里冒出的想法..."></textarea></div><div class="form-group"><label>身体感受</label><input type="text" id="e-body" placeholder="如：胸闷、心跳加速..."></div><div class="form-group"><label>我的反应</label><input type="text" id="e-reaction" placeholder="做了什么..."></div><div class="form-group"><label>我真正需要的是什么</label><textarea id="e-need" placeholder="深入思考..."></textarea></div><div class="form-group"><label>是否已缓解</label><select id="e-relieved"><option value="true">是</option><option value="false">否</option></select></div><div class="form-group"><label>补充记录</label><textarea id="e-extra" placeholder="其他想说的..."></textarea></div>',{footer:'<button class="btn btn-ghost" onclick="Modal.close()">取消</button><button class="btn btn-primary" onclick="Emotions.save()">保存</button>'})};
Emotions.selectEmo=function(el){document.querySelectorAll('.emotion-btn').forEach(b=>b.classList.remove('selected'));el.classList.add('selected');Emotions._selected=el.dataset.emo};
Emotions.save=async function(){if(!Emotions._selected){Toast.error('请选择情绪类型');return}const now=new Date();await DB.put(STORES.emotions,{id:Utils.uid(),type:Emotions._selected,intensity:parseInt(document.getElementById('e-intensity').value),event:document.getElementById('e-event').value,people:document.getElementById('e-people').value,thought:document.getElementById('e-thought').value,body:document.getElementById('e-body').value,reaction:document.getElementById('e-reaction').value,need:document.getElementById('e-need').value,relieved:document.getElementById('e-relieved').value==='true',extra:document.getElementById('e-extra').value,date:Utils.today(),time:String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'),createdAt:Utils.now()});Modal.close();Toast.success('情绪已记录');Modules.emotions()};
Emotions.view=async function(id){const e=await DB.get(STORES.emotions,id);if(!e)return;const t=Emotions.types.find(t=>t.name===e.type);Modal.open('情绪记录详情','<div class="card-pink" style="padding:16px;border-radius:var(--radius);margin-bottom:16px;text-align:center"><div style="font-size:36px">'+(t?t.icon:'<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="7.5" r="3"/><path d="M8 2v1.2M2 7.5h1.2"/><path d="M17.5 11.5a4.5 4.5 0 1 0 0 9H8a4.5 4.5 0 1 0 .8-8.9"/></svg>')+'</div><div style="font-size:18px;font-weight:600;color:var(--primary)">'+Utils.esc(e.type)+'</div><div class="text-sm text-muted">强度: '+e.intensity+'/10 · '+e.date+' '+e.time+'</div></div><div class="grid grid-2">'+[{l:'发生了什么',v:e.event},{l:'涉及的人或事',v:e.people},{l:'自动想法',v:e.thought},{l:'身体感受',v:e.body},{l:'我的反应',v:e.reaction},{l:'我真正需要什么',v:e.need}].map(x=>'<div class="card"><div class="text-sm text-muted">'+x.l+'</div><div>'+(x.v?Utils.esc(x.v):'<span class="text-muted">未填写</span>')+'</div></div>').join('')+'</div><div class="mt-4">'+(e.relieved?'<span class="tag tag-success">已缓解</span>':'<span class="tag tag-warning">尚未缓解</span>')+'</div>'+(e.extra?'<div class="form-group mt-4"><label>补充记录</label><div>'+Utils.esc(e.extra)+'</div></div>':''),{footer:'<button class="btn btn-ghost" onclick="Modal.close()">关闭</button><button class="btn btn-danger" onclick="Emotions.del(\''+e.id+'\')">删除</button>'})};
Emotions.del=async function(id){Modal.confirm('确定删除这条情绪记录吗？',async()=>{await DB.del(STORES.emotions,id);Modal.close();Toast.success('已删除');Modules.emotions()})};

Modules.emotionAnalysis=async function(){const all=await DB.getAll(STORES.emotions);document.getElementById('main').innerHTML='<div class="page-header"><div><h1><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 3a3 3 0 0 0-3 3v1.5A3 3 0 0 0 4 10.5 3 3 0 0 0 6 13a3 3 0 0 0 1 5.5A3 3 0 0 0 12 20a3 3 0 0 0 5-1.5 3 3 0 0 0 1-5.5 3 3 0 0 0 2-3.5 3 3 0 0 0-2.5-3V6a3 3 0 0 0-3-3z"/><path d="M12 3v18"/></svg> 情绪循环分析</h1><div class="subtitle">从历史记录中发现模式与规律</div></div></div><div class="ai-notice"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 18H2z"/><path d="M12 10v4M12 17.2v.3"/></svg> 此功能仅用于个人自我观察和复盘，不构成医学诊断或心理治疗建议。</div>';if(all.length<3){document.getElementById('main').innerHTML+='<div class="empty-state"><div class="empty-icon"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6"/><rect x="12" y="8" width="3" height="10"/><rect x="17" y="14" width="3" height="4"/></svg></div><div class="empty-text">至少需要3条情绪记录才能进行分析<br>当前记录数：'+all.length+'</div></div>';return}const typeCount={};all.forEach(e=>{typeCount[e.type]=(typeCount[e.type]||0)+1});const eventCount={};all.forEach(e=>{if(e.event){eventCount[e.event]=(eventCount[e.event]||0)+1}});const timeSlots={morning:0,afternoon:0,evening:0,night:0};all.forEach(e=>{const h=parseInt(e.time?.split(':')[0]||12);if(h>=6&&h<12)timeSlots.morning++;else if(h>=12&&h<18)timeSlots.afternoon++;else if(h>=18&&h<24)timeSlots.evening++;else timeSlots.night++});const sortedTypes=Object.entries(typeCount).sort((a,b)=>b[1]-a[1]);const positiveTypes=['开心','兴奋','满足','平和','放松','期待'];const negativeTypes=['焦虑','烦躁','生气','委屈','伤心','孤独','内疚','嫉妒','恐惧','疲惫','麻木','崩溃'];const posCount=sortedTypes.filter(([t])=>positiveTypes.includes(t)).reduce((s,[,c])=>s+c,0);const negCount=sortedTypes.filter(([t])=>negativeTypes.includes(t)).reduce((s,[,c])=>s+c,0);document.getElementById('main').innerHTML+='<div class="grid grid-2 mb-4"><div class="card"><div class="card-title"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6"/><rect x="12" y="8" width="3" height="10"/><rect x="17" y="14" width="3" height="4"/></svg> 高频情绪</div>'+sortedTypes.slice(0,8).map(([t,c])=>{const tp=Emotions.types.find(x=>x.name===t);return '<div class="list-item"><span class="nav-icon">'+(tp?tp.icon:'<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="7.5" r="3"/><path d="M8 2v1.2M2 7.5h1.2"/><path d="M17.5 11.5a4.5 4.5 0 1 0 0 9H8a4.5 4.5 0 1 0 .8-8.9"/></svg>')+'</span><div class="item-main"><div class="item-title">'+Utils.esc(t)+'</div></div><span class="tag">'+c+'次</span></div>'}).join('')+'</div><div class="card"><div class="card-title"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg> 情绪时间段分布</div>'+[{n:'早晨(6-12)',v:timeSlots.morning},{n:'下午(12-18)',v:timeSlots.afternoon},{n:'晚上(18-24)',v:timeSlots.evening},{n:'深夜(0-6)',v:timeSlots.night}].map(s=>'<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border)"><span style="font-size:13px">'+s.n+'</span><span style="font-size:12px;color:var(--text-secondary)">'+s.v+'次</span></div>').join('')+'</div></div><div class="grid grid-2 mb-4"><div class="card"><div class="card-title"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg> 积极情绪占比</div><div style="text-align:center;padding:20px"><div style="font-size:36px;font-weight:700;color:var(--success)">'+Math.round(posCount/all.length*100)+'%</div><div class="text-sm text-muted">'+posCount+'/'+all.length+'条</div></div></div><div class="card"><div class="card-title"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 13a4.5 4.5 0 1 0 0 9H7a4.5 4.5 0 1 0 .8-8.9"/><path d="M8 19v2M12 20v2M16 19v2"/></svg> 负面情绪占比</div><div style="text-align:center;padding:20px"><div style="font-size:36px;font-weight:700;color:var(--danger)">'+Math.round(negCount/all.length*100)+'%</div><div class="text-sm text-muted">'+negCount+'/'+all.length+'条</div></div></div></div>'+(Object.keys(eventCount).length>0?'<div class="card mb-4"><div class="card-title"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l-1 7 3 3H7l3-3z"/><path d="M12 14v6"/></svg> 高频触发事件</div>'+Object.entries(eventCount).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([e,c])=>'<div class="list-item"><div class="item-main"><div class="item-title">'+Utils.esc(e)+'</div></div><span class="tag">'+c+'次</span></div>').join('')+'</div>':'')+'<div class="ai-notice">以下分析基于历史记录的统计规律，仅供参考，不代表确定性结论。</div>';if(App.settings.aiEnabled&&all.length>=5){const patterns=[];if(negCount>posCount){patterns.push('近期负面情绪记录较多，可能需要关注自己的压力水平和休息质量。')}const topNeg=sortedTypes.find(([t])=>negativeTypes.includes(t));if(topNeg&&topNeg[1]>=3){patterns.push('「'+topNeg[0]+'」是你最常记录的负面情绪（'+topNeg[1]+'次），可以观察它通常在什么情境下出现。')}const topTimeSlot=Object.entries(timeSlots).sort((a,b)=>b[1]-a[1])[0];if(to const Env={
 isPlusApp(){return/Html5Plus/i.test(navigator.userAgent||'')||typeof window.plus!=='undefined'},
 onPlusReady(cb){
  if(typeof window.plus!=='undefined'){cb();return}
  let fired=false;const fire=()=>{if(!fired){fired=true;cb()}};
  document.addEventListener('plusready',fire,false);
  if(Env.isPlusApp()){let tries=0;const t=setInterval(()=>{tries++;if(typeof window.plus!=='undefined'){clearInterval(t);fire()}else if(tries>1200)clearInterval(t)},100)}
 }
};
const KeepAlive={
 active:false,timer:null,osc:null,gain:null,audioCtx:null,wakeLock:null,refreshCount:0,startedAt:null,hudTimer:null,
 init(){
  if(App.settings&&App.settings.keepAlive){
   KeepAlive.start();
   const retry=()=>{if(App.settings&&App.settings.keepAlive&&!KeepAlive.active)setTimeout(()=>KeepAlive.start(),150)};
   try{document.addEventListener('click',retry,{once:true});document.addEventListener('touchstart',retry,{once:true})}catch(e){}
  }
 },
 start(){
  if(KeepAlive.active){KeepAlive.status('已开启 ✅','var(--success)');return}
  try{
   const AC=window.AudioContext||window.webkitAudioContext;
   if(!AC){KeepAlive.status('当前环境不支持音频保活','var(--danger)');return}
   const ctx=new AC();KeepAlive.audioCtx=ctx;
   if(ctx.state==='suspended'){try{ctx.resume()}catch(e){}}
   KeepAlive.tone(ctx);
   if(KeepAlive.timer)clearInterval(KeepAlive.timer);
   KeepAlive.timer=setInterval(()=>{
    if(!KeepAlive.active){clearInterval(KeepAlive.timer);KeepAlive.timer=null;return}
    const c=KeepAlive.audioCtx;
    if(c){if(c.state==='suspended'){try{c.resume()}catch(e){}}KeepAlive.tone(c);KeepAlive.refreshCount++;KeepAlive.updateHud()}
   },15000);
   if(KeepAlive.hudTimer)clearInterval(KeepAlive.hudTimer);
   KeepAlive.hudTimer=setInterval(()=>KeepAlive.updateHud(),20000);
   KeepAlive.active=true;KeepAlive.startedAt=Date.now();KeepAlive.refreshCount=0;
   /* App（5+）环境：原生 CPU 唤醒锁，后台定时器与通知能继续运行的关键 */
   if(Env.isPlusApp())Env.onPlusReady(()=>{try{plus.device.setWakelock(true);console.log('🔒 App 原生 WakeLock 已开启')}catch(e){}});
   /* 屏幕唤醒锁（部分浏览器支持） */
   try{
    if(navigator.wakeLock){
     navigator.wakeLock.request('screen').then(w=>{KeepAlive.wakeLock=w}).catch(()=>{});
     document.addEventListener('visibilitychange',()=>{if(!document.hidden&&KeepAlive.active&&navigator.wakeLock){navigator.wakeLock.request('screen').then(w=>{KeepAlive.wakeLock=w}).catch(()=>{})}});
    }
   }catch(e){}
   if(App.settings){App.settings.keepAlive=true;try{Store.setSettings(App.settings)}catch(e){}}
   KeepAlive.status('已开启 ✅','var(--success)');KeepAlive.updateHud();
   Toast.success('后台保活已开启，切到后台仍可接收消息');
   console.log('🎵 后台保活音频已启动（18Hz 超低频无声）');
  }catch(e){
   console.warn('保活启动失败',e);
   KeepAlive.status('启动失败 ❌（请先点击页面任意处再试）','var(--danger)');
  }
 },
 tone(ctx){
  if(KeepAlive.osc){try{KeepAlive.osc.stop();KeepAlive.osc.disconnect()}catch(e){}KeepAlive.osc=null}
  if(KeepAlive.gain){try{KeepAlive.gain.disconnect()}catch(e){}KeepAlive.gain=null}
  try{
   const o=ctx.createOscillator(),g=ctx.createGain();
   o.type='sine';o.frequency.value=18;
   const t=ctx.currentTime;
   g.gain.setValueAtTime(0,t);
   g.gain.linearRampToValueAtTime(0.0005,t+0.05);
   g.gain.exponentialRampToValueAtTime(0.0003,t+0.5);
   o.connect(g);g.connect(ctx.destination);
   o.start(t);o.stop(t+5);
   KeepAlive.osc=o;KeepAlive.gain=g;
  }catch(e){}
 },
 stop(){
  KeepAlive.active=false;
  if(Env.isPlusApp())Env.onPlusReady(()=>{try{plus.device.setWakelock(false)}catch(e){}});
  if(KeepAlive.timer){clearInterval(KeepAlive.timer);KeepAlive.timer=null}
  if(KeepAlive.hudTimer){clearInterval(KeepAlive.hudTimer);KeepAlive.hudTimer=null}
  if(KeepAlive.osc){try{KeepAlive.osc.stop();KeepAlive.osc.disconnect()}catch(e){}KeepAlive.osc=null}

 _last:0,_plusNotifId:1000,_pending:null,_pendingTimer:null,_autoAsked:false,

 send(title,body,opts){

 /* App 原生横幅通知（Android 8+ 高优先级渠道 IMPORTANCE_HIGH → 横幅+声音+震动；降级 plus.push） */
 _plusNative(title,body,opts){
  Notify._pending=opts||{};
  if(Notify._pendingTimer)clearTimeout(Notify._pendingTimer);
  Notify._pendingTimer=setTimeout(()=>{Notify._pending=null},90000);
  Env.onPlusReady(()=>{
   let sent=false;
   try{
    if(plus.os&&plus.os.name==='Android'&&plus.android){
     const main=plus.android.runtimeMainActivity();
     plus.android.importClass(main);
     const nm=main.getSystemService('notification');
     const V=plus.android.importClass('android.os.Build$VERSION');
     const Notification=plus.android.importClass('android.app.Notification');
     const Builder=plus.android.importClass('android.app.Notification$Builder');
     let builder;
     if(V.SDK_INT>=26){
      const NC=plus.android.importClass('android.app.NotificationChannel');
      const NMC=plus.android.importClass('android.app.NotificationManager');
      const ch=new NC('wl_messages','新消息通知',NMC.IMPORTANCE_HIGH);
      try{ch.setDescription('工作台新消息横幅通知');ch.enableLights(true);ch.enableVibration(true);ch.setShowBadge(true)}catch(e2){}
      nm.createNotificationChannel(ch);
      builder=new Builder(main,'wl_messages');
     }else{
      builder=new Builder(main);
      builder.setPriority(Notification.PRIORITY_HIGH);
      builder.setDefaults(Notification.DEFAULT_ALL);
     }
     builder.setContentTitle(title||(App.settings&&App.settings.appName)||'工作台');
     builder.setContentText(String(body||''));
     builder.setAutoCancel(true);
     builder.setWhen(Date.now());
     let iconId=0;
     try{const ai=main.getApplicationInfo();plus.android.importClass(ai);iconId=ai.icon||0}catch(e2){}
     if(!iconId){try{const Rd=plus.android.importClass('android.R$drawable');iconId=Rd.ic_dialog_info}catch(e2){}}
     if(iconId)builder.setSmallIcon(iconId);
     try{
      const PI=plus.android.importClass('android.app.PendingIntent');
      const li=main.getPackageManager().getLaunchIntentForPackage(main.getPackageName());
      const pi=PI.getActivity(main,0,li,PI.FLAG_UPDATE_CURRENT|PI.FLAG_IMMUTABLE);
      builder.setContentIntent(pi);
     }catch(e2){console.warn('构建点击事件失败',e2)}
     Notify._plusNotifId=(Notify._plusNotifId||1000)+1;
     nm.notify(Notify._plusNotifId,builder.build());
     sent=true;
    }
   }catch(e){console.warn('原生横幅通知发送失败，降级 plus.push',e)}
   if(!sent){try{plus.push.createMessage(String(body||title),JSON.stringify(opts||{}),{title:title,sound:'system',cover:false})}catch(e2){}}
  });
 },

SoulLink.save=async function(){const title=document.getElementById('s-title').value.trim();if(!title){Toast.error('请输入标题');return}const now=new Date();const profiles=await DB.getAll(STORES.soulProfiles);const pid=SoulLink.currentProfile||profiles[0]?.id;const type=document.getElementById('s-type').value;await DB.put(STORES.soulRecords,{id:Utils.uid(),profileId:pid,title,recordType:type,date:document.getElementById('s-date').value,time:String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'),interactionMethod:type==='真实互动'?(document.getElementById('s-method').value||null):null,whatHappened:document.getElementById('s-happened').value,feeling:document.getElementById('s-feeling').value,emotion:document.getElementById('s-emotion').value,intensity:parseInt(document.getElementById('s-intensity').value)||5,understanding:document.getElementById('s-understanding').value,need:document.getElementById('s-need').value,insight:document.getElementById('s-insight').value,tags:document.getElementById('s-tags').value.split(',').map(s=>s.trim()).filter(Boolean),important:document.getElementById('s-important').value==='true',countAsReal:type==='真实互动'?document.getElementById('s-count').value==='true':false,starId:(document.getElementById('s-star')&&document.getElementById('s-star').value)||null,createdAt:Utils.now()});Modal.close();Toast.success('记录已保存');Modules.soul()};
SoulLink.manageTypes=function(){const s=App.settings;const rt=Array.isArray(s.soulRecordTypes)?s.soulRecordTypes:[];const im=Array.isArray(s.soulMethods)?s.soulMethods:[];const BASE=['真实互动','同步性或显化记录','感想与成长','梦境与直觉','重要纪念'];const enc=encodeURIComponent;const row=(t,kind,locked)=>'<div class="list-item"><div class="item-main"><div class="item-title">'+Utils.esc(t)+(locked?' <span class="tag">内置</span>':'')+'</div></div><div class="flex gap-2">'+(locked?'':'<button class="btn btn-ghost btn-sm" onclick="SoulLink.editType(\''+kind+'\',\''+enc(t)+'\')">编辑</button><button class="btn btn-ghost btn-sm" style="color:var(--danger)" onclick="SoulLink.delType(\''+kind+'\',\''+enc(t)+'\')">删除</button>')+'</div></div>';Modal.open('类型管理','<div class="card mb-4"><div class="card-title">记录类型<div class="text-sm text-muted" style="font-weight:400">内置类型保留，新增类型可编辑/删除；编辑改名会同步更新对应记录</div></div>'+(rt.length?rt.map(t=>row(t,'rt',BASE.includes(t))).join(''):'<div class="text-muted text-sm">暂无</div>')+'<div class="flex gap-2 mt-2"><input type="text" id="mt-add-rt" placeholder="新增记录类型名称" style="flex:1"><button class="btn btn-primary btn-sm" onclick="SoulLink.addType(\'rt\')">添加</button></div></div><div class="card"><div class="card-title">互动方式 / 事件来源</div>'+(im.length?im.map(t=>row(t,'im',false)).join(''):'<div class="text-muted text-sm">暂无，请在下方添加</div>')+'<div class="flex gap-2 mt-2"><input type="text" id="mt-add-im" placeholder="新增互动方式名称" style="flex:1"><button class="btn btn-primary btn-sm" onclick="SoulLink.addType(\'im\')">添加</button></div></div>',{footer:'<button class="btn btn-primary" onclick="Modal.close()">完成</button>'})};
SoulLink.addType=function(kind){const inp=document.getElementById(kind==='rt'?'mt-add-rt':'mt-add-im');const v=(inp.value||'').trim();if(!v){Toast.error('请输入名称');return}const key=kind==='rt'?'soulRecordTypes':'soulMethods';const list=App.settings[key]||(App.settings[key]=[]);const base=['真实互动','同步性或显化记录','感想与成长','梦境与直觉','重要纪念'];if(list.includes(v)||(kind==='rt'&&base.includes(v))){Toast.error('该名称已存在');return}list.push(v);Store.setSettings(App.settings);Toast.success('已添加：'+v);SoulLink.manageTypes()};
SoulLink.editType=function(kind,encName){const old=decodeURIComponent(encName);Modal.open('编辑类型','<div class="form-group"><label>新名称</label><input type="text" id="mt-new-name" value="'+Utils.esc(old)+'"></div>',{footer:'<button class="btn btn-ghost" onclick="SoulLink.manageTypes()">取消</button><button class="btn btn-primary" onclick="SoulLink.saveTypeEdit(\''+kind+'\',\''+encName+'\')">保存</button>'})};
SoulLink.saveTypeEdit=async function(kind,encName){const old=decodeURIComponent(encName);const nv=(document.getElementById('mt-new-name').value||'').trim();if(!nv){Toast.error('请输入名称');return}if(nv===old){SoulLink.manageTypes();return}const key=kind==='rt'?'soulRecordTypes':'soulMethods';const list=App.settings[key]||[];if(list.includes(nv)){Toast.error('该名称已存在');return}const idx=list.indexOf(old);if(idx<0){Toast.error('原类型不存在');return}list[idx]=nv;Store.setSettings(App.settings);const field=kind==='rt'?'recordType':'interactionMethod';const all=await DB.getAll(STORES.soulRecords);let n=0;for(const r of all){if(r[field]===old){r[field]=nv;await DB.put(STORES.soulRecords,r);n++}}Toast.success('已改名'+(n?'，'+n+'条记录已同步':''));Modal.close();if(App.currentModule==='soul'){Modules.soul()}};
SoulLink.delType=async function(kind,encName){const name=decodeURIComponent(encName);const key=kind==='rt'?'soulRecordTypes':'soulMethods';const list=App.settings[key]||[];const field=kind==='rt'?'recordType':'interactionMethod';const all=await DB.getAll(STORES.soulRecords);const used=all.filter(r=>r[field]===name).length;if(used>0){Toast.error('「'+name+'」下有 '+used+' 条记录，请改用「编辑」重命名');return}Modal.confirm('确定删除类型「'+Utils.esc(name)+'」？',()=>{const idx=list.indexOf(name);if(idx>=0){list.splice(idx,1);Store.setSettings(App.settings)}Toast.success('已删除');Modal.close();if(App.currentModule==='soul'){Modules.soul()}})};

const Assets={personIcon:'<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',cropSquare(b64){return new Promise(r=>{const img=new Image();img.onload=()=>{try{const sz=Math.min(img.width,img.height);const c=document.createElement('canvas');c.width=c.height=Math.min(512,sz);c.getContext('2d').drawImage(img,(img.width-sz)/2,(img.height-sz)/2,sz,sz,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.85))}catch(e){r(b64)}};img.onerror=()=>r(b64);img.src=b64})},async apply(){const layer=document.getElementById('bg-layer');if(!layer)return;try{const imgs=await DB.getAll(STORES.images);const bgs=imgs.filter(i=>i.kind==='background');const op=App.settings&&App.settings.bgOpacity!==undefined?App.settings.bgOpacity:0.9;const blur=App.settings&&App.settings.glassBlur!==undefined?App.settings.glassBlur:16;document.documentElement.style.setProperty('--bg-img-opacity',op);document.documentElement.style.setProperty('--glass-blur',blur+'px');if(bgs.length>0){const idx=Math.floor(Date.now()/86400000)%bgs.length;layer.style.backgroundImage='url('+bgs[idx].data+')';layer.style.opacity=op}else{layer.style.backgroundImage='';layer.style.opacity=0}}catch(e){}await Assets.applyAvatars()},async applyAvatars(){let av=null;try{av=await DB.get(STORES.images,'user_avatar')}catch(e){}const els=document.querySelectorAll('.js-avatar');for(const el of els){el.innerHTML=av?'<img src="'+av.data+'" style="width:100%;height:100%;object-fit:cover">':Assets.personIcon}}};

    const wk = LinkStatus.countRange(list, 7), mo = LinkStatus.countRange(list, 31);
    const st = rec ? LinkStatus.statOf(rec.status) : null;
    const qIcon = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 15.5v.5"/></svg>';
    let h = '<div class="card ls-widget mb-4"><div class="ls-weather" style="color:' + (st ? st.color : 'var(--text-muted)') + '" onclick="' + (rec ? 'LinkStatus.detail()' : 'LinkStatus.showForm()') + '">' + (st ? st.icon : qIcon) + '<div><div class="ls-w-label" style="color:var(--text-primary)">今日链接状态：' + (st ? st.label : '未记录') + '</div><div class="ls-w-sub">' + (rec ? (Utils.esc((rec.reason || '').slice(0, 30)) || '点击查看今日记录详情') : '点击记录今天的链接感知状态') + '</div></div></div>';
    h += '<div class="ls-widget-stats"><span>本周：活跃 ' + wk.active + ' · 平静 ' + wk.calm + ' · 偏弱 ' + wk.weak + '</span><span>本月：活跃 ' + mo.active + ' · 平静 ' + mo.calm + ' · 偏弱 ' + mo.weak + '</span><span>今日互动：' + todayInter + ' 次</span></div>';
    h += '<div class="ls-widget-btns"><button class="btn btn-primary btn-sm" onclick="LinkStatus.showForm()">' + (rec ? '修改今日状态' : '记录今日状态') + '</button><button class="btn btn-secondary btn-sm" onclick="LinkStatus.monthly()">月度链接状态分析</button></div>';
    h += '<div class="chart-container" style="height:170px"><canvas id="ls-chart"></canvas></div>';
    h += '<div class="ls-note">状态由你手动选择，系统不做自动判断，也不能推断对方状态；此功能用于长期观察你的链接感知与身体、情绪、现实环境之间可能存在的规律。</div></div>';
    return h;
  },
  showForm() {
    const today = Utils.today();
    DB.get(STORES.linkStatus, 'ls-' + today).then(rec => {
      LinkStatus._edit = rec || null;
      const st = rec ? rec.status : null;
      let h = '<div class="form-group"><label>今日日期：' + today + '（每天仅一条记录，可随时修改）</label><div class="ls-stats-row">';
      LinkStatus.STATS.forEach(t => {
        h += '<div class="ls-st' + (st === t.k ? ' on' : '') + '" data-k="' + t.k + '" onclick="document.querySelectorAll(\'.ls-st\').forEach(e=>e.classList.remove(\'on\'));this.classList.add(\'on\')"><span style="color:' + t.color + '">' + t.icon + '</span><b>' + t.label + '</b><i>' + t.desc + '</i></div>';
      });
      h += '</div></div>';
      h += '<div class="form-group"><label>为什么我认为今天是这个状态？</label><textarea id="ls-reason" rows="3" placeholder="记录你的观察依据，例如：&#10;· 今天实际互动次数 / 是否有聊天交流&#10;· 是否出现同步事件或显化记录&#10;· 是否有梦境或直觉体验&#10;· 今天自己的身体状态 / 现实生活状态">' + (rec ? Utils.esc(rec.reason || '') : '') + '</textarea></div>';
      h += '<div class="form-group"><label>今日现实状态（可多选）</label>';
      for (const g in LinkStatus.FACTOR_GROUPS) {
        h += '<div class="ls-fg"><div class="ls-fg-title">' + g + '</div><div class="ls-tags">';
        LinkStatus.FACTOR_GROUPS[g].forEach(f => {
          const on = rec && (rec.factors || []).includes(f);
          h += '<span class="ls-tag' + (on ? ' on' : '') + '" data-v="' + f + '" onclick="this.classList.toggle(\'on\')">' + f + '</span>';
        });
        h += '</div></div>';
      }
      h += '</div>';
      h += '<div class="form-group"><label>补充说明</label><input type="text" id="ls-extra" placeholder="记录当天的特殊情况" value="' + (rec ? Utils.esc(rec.extra || '') : '') + '"></div>';
      Modal.open('今日链接状态', h, { footer: '<button class="btn btn-ghost" onclick="Modal.close()">取消</button><button class="btn btn-primary" onclick="LinkStatus.save()">保存</button>' });
    });
  },
  save: async function () {
    const sel = document.querySelector('.ls-st.on');
    if (!sel) { Toast.error('请先选择今天的链接状态'); return }
    const status = sel.dataset.k;
    const reason = document.getElementById('ls-reason').value.trim();
    const extra = document.getElementById('ls-extra').value.trim();
    const factors = Array.from(document.querySelectorAll('.ls-tag.on')).map(t => t.dataset.v);
    const date = Utils.today();
    const prev = LinkStatus._edit || {};
    await DB.put(STORES.linkStatus, { id: 'ls-' + date, date: date, status: status, reason: reason, extra: extra, factors: factors, createdAt: prev.createdAt || Utils.now(), updatedAt: Utils.now() });
    Modal.close(); Toast.success('今日链接状态已保存');
    if (status === 'weak') {
      try {
        const emos = (await DB.getAll(STORES.emotions)).filter(e => e.date === date);
        if (emos.some(e => e.type === '低落')) { LinkStatus._askSync(); return }
      } catch (e) { }
    }
    Modules.soul();
  },
  _askSync() {
    Modal.open('联动提示', '<p style="font-size:13px;color:var(--text-secondary);line-height:1.9">检测到今天你既记录了「链接状态：偏弱」，也记录了「情绪：低落」。<br>是否把这次关联同步到情绪记录，方便长期观察两者的关系？</p>', { footer: '<button class="btn btn-ghost" onclick="Modal.close();Modules.soul()">暂不同步</button><button class="btn btn-primary" onclick="LinkStatus.doSync()">同步到情绪</button>' });
  },
  doSync: async function () {
    const now = new Date();
    await DB.put(STORES.emotions, { id: Utils.uid(), type: '低落', intensity: 5, event: '链接状态偏弱（同步自每日链接状态追踪）', people: '', date: Utils.today(), time: String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0'), createdAt: Utils.now() });
    Modal.close(); Toast.success('已同步到情绪记录'); Modules.soul();
  },
  detail() {
    const today = Utils.today();
    DB.get(STORES.linkStatus, 'ls-' + today).then(rec => {
      if (!rec) { LinkStatus.showForm(); return }
      const st = LinkStatus.statOf(rec.status);
      let h = '<div class="ls-detail"><div class="ls-d-head" style="color:' + st.color + '">' + st.icon + ' ' + today + ' · ' + st.label + '</div>';
      h += '<div class="ls-d-row"><b>状态依据：</b>' + Utils.esc(rec.reason || '（未填写）') + '</div>';
      if ((rec.factors || []).length) h += '<div class="ls-d-row"><b>现实状态：</b>' + rec.factors.map(f => '<span class="ls-tag on">' + f + '</span>').join(' ') + '</div>';
      if (rec.extra) h += '<div class="ls-d-row"><b>补充说明：</b>' + Utils.esc(rec.extra) + '</div>';
      h += '</div>';
      Modal.open('今日链接状态详情', h, { footer: '<button class="btn btn-ghost" onclick="Modal.close()">关闭</button><button class="btn btn-primary" onclick="LinkStatus.showForm()">修改</button>' });
    });
  },
  renderChart(list) {
    const ctx = document.getElementById('ls-chart');
    if (!ctx) return;
    if (App.charts.ls) { try { App.charts.ls.destroy() } catch (e) { } }
    const data = list.slice(-30);
    if (data.length === 0) return;
    const map = { active: 3, calm: 2, weak: 1 }, lbl = { 3: '活跃', 2: '平静', 1: '偏弱' };
    App.charts.ls = new Chart(ctx, {
      type: 'line',
      data: {
        labels: data.map(r => r.date.slice(5)),
        datasets: [{ label: '链接状态', data: data.map(r => map[r.status] || 2), borderColor: '#9d92b8', backgroundColor: 'rgba(157,146,184,.12)', fill: true, tension: .35, pointRadius: 5, pointBackgroundColor: data.map(r => LinkStatus.color(r.status)) }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: { y: { min: .5, max: 3.5, ticks: { stepSize: 1, callback: v => lbl[v] || '' } }, x: { ticks: { font: { size: 10 } } } },
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: function (c) { const r = data[c.dataIndex]; return LinkStatus.label(r.status) + ((r.factors || []).length ? ' · ' + r.factors.slice(0, 3).join('、') : '') } } }
        }
      }
    });
  },
  fetchAndRender: async function () {
    const list = (await DB.getAll(STORES.linkStatus)).sort((a, b) => (a.date || '').localeCompare(b.date || ''));
    LinkStatus.renderChart(list);
  },
  monthly: async function () {
    const list = await DB.getAll(STORES.linkStatus);
    const today = Utils.today();
    const ym = today.slice(0, 7), yr = today.slice(0, 4);
    const mon = list.filter(r => (r.date || '').startsWith(ym)).sort((a, b) => a.date.localeCompare(b.date));
    const yearList = list.filter(r => (r.date || '').startsWith(yr));
    const cnt = { active: 0, calm: 0, weak: 0 }; mon.forEach(r => { if (cnt[r.status] !== undefined) cnt[r.status]++ });
    const yc = { active: 0, calm: 0, weak: 0 }; yearList.forEach(r => { if (yc[r.status] !== undefined) yc[r.status]++ });
    const yn = yc.active + yc.calm + yc.weak;
    let h = '<h3 style="margin-bottom:10px">' + ym + ' 链接状态复盘</h3>';
    h += '<div class="ls-d-row"><b>本月记录：</b>活跃 ' + cnt.active + ' 次 · 平静 ' + cnt.calm + ' 次 · 偏弱 ' + cnt.weak + ' 次（共 ' + mon.length + ' 天）</div>';
    h += '<div class="ls-d-row"><b>今年占比：</b>' + (yn > 0 ? '活跃 ' + Math.round(yc.active / yn * 100) + '% · 平静 ' + Math.round(yc.calm / yn * 100) + '% · 偏弱 ' + Math.round(yc.weak / yn * 100) + '%（共 ' + yn + ' 天）' : '今年暂无记录') + '</div>';
    if (mon.length === 0) { h += '<p class="text-muted" style="padding:20px 0">本月还没有记录，先去记录今天的链接状态吧。</p>'; Modal.open('月度链接状态分析', h); return }
    const byS = {}; mon.forEach(r => { (byS[r.status] = byS[r.status] || []).push(r) });
    function topFactors(arr) { const m = {}; arr.forEach(r => (r.factors || []).forEach(f => m[f] = (m[f] || 0) + 1)); return Object.entries(m).sort((a, b) => b[1] - a[1]).slice(0, 3) }
    const act = topFactors(byS.active || []), wkF = topFactors(byS.weak || []);
    h += '<div style="margin:14px 0 6px;font-weight:600">AI 链接状态分析</div>';
    h += '<div class="privacy-notice" style="line-height:1.9;font-size:13px">';
    h += '· 活跃状态出现时，你记录的共同因素：' + (act.length ? act.map(x => x[0] + '（' + x[1] + '次）').join('、') + '。' : '本月暂无活跃记录。') + '<br>';
    h += '· 偏弱状态出现时，你记录的共同因素：' + (wkF.length ? wkF.map(x => x[0] + '（' + x[1] + '次）').join('、') + '。' : '本月暂无偏弱记录。') + '<br>';
    let sleepLink = 0;
    (byS.weak || []).forEach(r => {
      const prev = list.find(x => x.date === Utils.fmtDate(new Date(new Date(r.date).getTime() - 86400000)));
      if (prev && (prev.factors || []).some(f => f === '熬夜' || f === '睡眠不足')) sleepLink++;
    });
    if (sleepLink > 0) h += '· 从你的记录来看，' + sleepLink + ' 次偏弱状态的前一天记录过熬夜或睡眠不足，可以继续观察二者是否存在稳定关联。<br>';
    h += '· 以上为基于你本人记录的观察方向，仅供自我探索参考，不构成任何确定性结论，也不用于判断链接是否真实存在。</div>';
    h += '<div class="chart-container-lg" style="height:240px;margin-top:12px"><canvas id="ls-mchart"></canvas></div>';
    Modal.open('月度链接状态分析', h, { footer: '<button class="btn btn-ghost" onclick="Modal.close()">关闭</button>' });
    setTimeout(function () {
      const ctx = document.getElementById('ls-mchart');
      if (!ctx) return;
      if (App.charts.lsm) { try { App.charts.lsm.destroy() } catch (e) { } }
      App.charts.lsm = new Chart(ctx, {
        type: 'line',
        data: { labels: mon.map(r => r.date.slice(5)), datasets: [{ data: mon.map(r => ({ active: 3, calm: 2, weak: 1 })[r.status] || 2), borderColor: '#9d92b8', backgroundColor: 'rgba(157,146,184,.12)', fill: true, tension: .35, pointBackgroundColor: mon.map(r => LinkStatus.color(r.status)) }] },
        options: { responsive: true, maintainAspectRatio: false, scales: { y: { min: .5, max: 3.5, ticks: { stepSize: 1, callback: v => ({ 3: '活跃', 2: '平静', 1: '偏弱' })[v] || '' } } }, plugins: { legend: { display: false } } }
      });
    }, 60);
  }
};

v><div class="item-sub">'+d.date+(d.starTitle?' · 想到「'+Utils.esc(d.starTitle)+'」':'')+'</div></div></div>').join('')||'<div class="text-muted text-sm">还没有星星日记。哪天想到某颗星星了，随手记一笔就好。</div>';document.getElementById('main').innerHTML='<div class="page-header"><div><h1>✦ 链接星图</h1><div class="subtitle">愿望记录 → 现实观察 → 情绪体验 → 长期复盘的私人星空</div></div><div class="flex gap-2"><button class="btn btn-secondary btn-sm" onclick="Modules.soul()">← 返回'+Utils.esc(App.settings.soulName)+'</button><button class="btn btn-secondary btn-sm" onclick="StarMap.diary()"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg> 星星日记</button><button class="btn btn-secondary btn-sm" onclick="StarMap.review()"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6"/><rect x="12" y="8" width="3" height="10"/><rect x="17" y="14" width="3" height="4"/></svg> 星图回顾</button><button class="btn btn-primary btn-sm" onclick="StarMap.showForm()">＋ 新增一颗星星</button></div></div><div class="privacy-notice mb-4">此页面为隐私空间，只做愿望记录与现实观察，不预测未来、不判定愿望一定会实现。</div><div class="starmap-wrap mb-4"><div class="starmap-moon"></div><div class="starmap-topbar"><span>'+sky.length+' 颗星星在天空 · 宝物袋 '+bag.length+' 件</span></div>'+skyHtml+'<div class="starmap-legend"><span>'+StarMap.STATUS.waiting.icon+' 等待观察</span><span>'+StarMap.STATUS.partial.icon+' 部分对应</span><span>'+StarMap.STATUS.realized.icon+' 已实现</span><span style="opacity:.55">'+StarMap.STATUS.none.icon+' 暂未发生</span><span style="opacity:.55">'+StarMap.STATUS.closed.icon+' 已入收藏区</span></div></div><div class="grid grid-2"><div class="card"><div class="card-title"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v9h14v-9M12 8v13"/><path d="M12 8c-2.5 0-5-1-5-3.2S10 2 12 5c2-3 5-3 5-.8S14.5 8 12 8z"/></svg> 宝物袋（已摘下的星星）</div>'+bagHtml+'</div><div class="card"><div class="card-title"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg> 星星日记</div>'+diaryHtml+'</div></div>'+(closedHtml?'<div class="card mt-4"><div class="card-title"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5.5"/><ellipse cx="12" cy="12" rx="10" ry="3.5" transform="rotate(-18 12 12)"/></svg> 收藏区（不再期待）</div>'+closedHtml+'</div>':'')},
showForm(){Modal.open('新增一颗星星','<div class="form-group"><label>愿望标题</label><input type="text" id="sm-title" placeholder="例如：希望有一天现实中有人送我一朵花"></div><div class="form-group"><label>愿望详细描述</label><textarea id="sm-desc" rows="4" placeholder="我为什么想体验这件事 / 这个愿望对我的意义 / 我期待的感觉 / 我脑海中的画面…"></textarea></div><div class="form-row"><div class="form-group"><label>愿望分类</label><select id="sm-cat">'+StarMap.CATS.map(c=>'<option value="'+c+'">'+c+'</option>').join('')+'</select></div><div class="form-group"><label>重要程度（决定星星大小）</label><select id="sm-imp"><option value="1">1 · 随手一许</option><option value="2">2 · 有点在意</option><option value="3" selected>3 · 普通</option><option value="4">4 · 很在意</option><option value="5">5 · 非常重要</option></select></div></div><div class="text-muted text-sm">创建日期将自动记录。星图只帮助保存愿望并观察现实，不预测未来。</div>',{footer:'<button class="btn btn-ghost" onclick="Modal.close()">取消</button><button class="btn btn-primary" onclick="StarMap.save()">许下这颗星星</button>'})},
async save(){const title=document.getElementById('sm-title').value.trim();if(!title){Toast.error('请输入愿望标题');return}await DB.put(STORES.stars,{id:Utils.uid(),kind:'wish',title,desc:document.getElementById('sm-desc').value,category:document.getElementById('sm-cat').value,importance:parseInt(document.getElementById('sm-imp').value)||3,status:'waiting',pickedAt:null,events:[],createdAt:Utils.now()});Modal.close();Toast.success('一颗新的星星升上了天空 ✦');StarMap.view()},
async viewStar(id){const s=await DB.get(STORES.stars,id);if(!s||s.kind==='diary')return;const st=StarMap.STATUS[s.status]||StarMap.STATUS.waiting;const rel=(await DB.getAll(STORES.soulRecords)).filter(r=>r.starId===id);const ev=s.events||[];let h='<div class="grid grid-2 mb-4"><div class="card"><div class="text-sm text-muted">愿望</div><div style="font-weight:600">'+Utils.esc(s.title)+'</div><div class="text-sm text-muted mt-2">分类：'+Utils.esc(s.category||'未分类')+' · 重要度 '+(s.importance||3)+'/5</div><div class="text-sm text-muted">创建于 '+Utils.fmtDate(s.createdAt)+(s.pickedAt?' · 摘星于 '+Utils.fmtDate(s.pickedAt):'')+'</div>'+(s.desc?'<div class="text-sm mt-2" style="white-space:pre-wrap">'+Utils.esc(s.desc)+'</div>':'')+'</div><div class="card"><div class="text-sm text-muted">当前状态</div><div style="font-weight:600;margin:4px 0">'+st.icon+' '+st.label+'</div><select id="sm-status" style="width:100%;padding:6px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-input)">'+Object.keys(StarMap.STATUS).map(k=>'<option value="'+k+'" '+(k===s.status?'selected':'')+'>'+StarMap.STATUS[k].icon+' '+StarMap.STATUS[k].label+'</option>').join('')+'</select><button class="btn btn-secondary btn-sm mt-2" onclick="StarMap.setStatus(\''+s.id+'\')">更新状态</button></div></div>';h+='<div class="card mb-4" style="padding:14px"><div class="flex gap-2" style="align-items:center;justify-content:space-between;margin-bottom:8px"><b>后续事件记录（'+ev.length+'）</b><button class="btn btn-secondary btn-sm" onclick="StarMap.addEvent(\''+s.id+'\')">＋ 添加后续事件</button></div>'+(ev.length?ev.slice().reverse().map(e=>'<div class="timeline-item"><div class="item-title" style="font-size:13px">'+Utils.fmtDate(e.date)+' · '+Utils.esc(e.what)+'</div><div class="item-sub" style="white-space:pre-wrap">实际情况：'+Utils.esc(e.actual||'—')+'\n我的感受：'+Utils.esc(e.feeling||'—')+'\n是否与愿望有关（我的理解）：'+Utils.esc(e.related||'未填写')+'</div></div>').join(''):'<div class="text-muted text-sm">还没有记录到相关现实事件</div>')+'<div class="text-muted text-sm mt-2" style="line-height:1.6">注：这里区分「实际发生 / 我的感受 / 我的理解」，不会自动把事件判定为愿望实现。</div></div>';if(rel.length)h+='<div class="card mb-4" style="padding:14px"><b class="text-sm">关联的'+Utils.esc(App.settings.soulName)+'记录（'+rel.length+'）</b>'+rel.slice(0,5).map(r=>'<div class="list-item"><div class="item-main"><div class="item-title" style="font-size:13px">'+Utils.esc(r.title)+'</div><div class="item-sub">'+r.date+' · '+Utils.esc(r.recordType)+'</div></div></div>').join('')+'</div>';h+='<div class="flex gap-2">'+(s.pickedAt?'<button class="btn btn-secondary" onclick="StarMap.unpick(\''+s.id+'\')">放回天空</button>':'<button class="btn btn-secondary" onclick="StarMap.pick(\''+s.id+'\')"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5S4 15 4 9.5C4 6.5 6.5 5 8.5 5c1.5 0 2.8.8 3.5 2 .7-1.2 2-2 3.5-2 2 0 4.5 1.5 4.5 4.5 0 5.5-8 11-8 11z"/></svg> 摘下这颗星（放入宝物袋）</button>')+'<button class="btn btn-ghost" style="color:var(--danger)" onclick="StarMap.del(\''+s.id+'\')">删除</button></div>';Modal.open('星星详情',h,{size:'lg'})},
async setStatus(id){const s=await DB.get(STORES.stars,id);if(!s)return;const ns=document.getElementById('sm-status').value;s.status=ns;await DB.put(STORES.stars,s);Toast.success('状态已更新');StarMap.view();if(ns==='realized'&&!s.pickedAt){StarMap.askEmotion(s)}else{StarMap.viewStar(id)}},
askEmotion(s){Modal.open('同步到情绪曲线？','<div class="text-sm" style="line-height:1.8">这颗星星被标记为「已实现」，它带给你一些情绪了吗？<br>要不要在情绪曲线里记一条开心的情绪？</div>',{footer:'<button class="btn btn-ghost" onclick="Modal.close()">不用了</button><button class="btn btn-primary" onclick="StarMap.syncEmotion(\''+s.id+'\')">记录开心情绪</button>'})},
async syncEmotion(id){const s=await DB.get(STORES.stars,id);const now=new Date();if(s)await DB.put(STORES.emotions,{id:Utils.uid(),type:'开心',intensity:8,event:'星星实现：'+s.title,people:'',thought:'',body:'',reaction:'',need:'',relieved:true,extra:'',date:Utils.today(),time:String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'),createdAt:Utils.now()});Modal.close();Toast.success('已同步到情绪曲线');StarMap.view()},
addEvent(id){Modal.open('添加后续事件','<div class="form-group"><label>日期</label><input type="date" id="se-date" value="'+Utils.today()+'"></div><div class="form-group"><label>发生了什么</label><textarea id="se-what" rows="2" placeholder="客观描述出现的相关事件"></textarea></div><div class="form-group"><label>实际情况（可确认的部分）</label><textarea id="se-actual" rows="2" placeholder="与感受区分开，只写能确认的"></textarea></div><div class="form-group"><label>我的感受</label><textarea id="se-feeling" rows="2" placeholder="当时的情绪与体验"></textarea></div><div class="form-group"><label>是否认为与这个愿望有关（我的理解）</label><select id="se-related"><option value="是">是</option><option value="部分相关">部分相关</option><option value="不确定">不确定</option><option value="否">否</option></select></div>',{footer:'<button class="btn btn-ghost" onclick="Modal.close()">取消</button><button class="btn btn-primary" onclick="StarMap.saveEvent(\''+id+'\')">保存</button>'})},
async saveEvent(id){const s=await DB.get(STORES.stars,id);if(!s)return;const what=document.getElementById('se-what').value.trim();if(!what){Toast.error('请填写发生了什么');return}s.events=s.events||[];s.events.push({date:document.getElementById('se-date').value,what,actual:document.getElementById('se-actual').value,feeling:document.getElementById('se-feeling').value,related:document.getElementById('se-related').value});if(s.status==='waiting')s.status='partial';await DB.put(STORES.stars,s);Modal.close();Toast.success('事件已记录（不会自动判定为实现）');StarMap.viewStar(id);StarMap.view()},
pick(id){Modal.confirm('确定摘下这颗星星吗？它将从天空消失并进入宝物袋（之后可放回）。',async()=>{const s=await DB.get(STORES.stars,id);if(!s)return;s.pickedAt=Utils.now();await DB.put(STORES.stars,s);Modal.close();Toast.success('已放入宝物袋');StarMap.view()})},
async unpick(id){const s=await DB.get(STORES.stars,id);if(!s)return;s.pickedAt=null;await DB.put(STORES.stars,s);Toast.success('已放回天空');StarMap.viewStar(id);StarMap.view()},
del(id){Modal.confirm('确定永久删除这颗星星及其全部记录吗？',async()=>{await DB.del(STORES.stars,id);Modal.close();Toast.success('已删除');StarMap.view()})},
async diary(){const stars=(await StarMap.wishes()).filter(s=>!s.pickedAt&&s.status!=='closed');const d=Utils.today();const old=(await StarMap.all()).find(x=>x.kind==='diary'&&x.date===d);Modal.open('星星日记 · '+d,'<div class="text-muted text-sm mb-2" style="line-height:1.7">今天有没有什么事情让你想到某颗星星？轻轻记一笔就好，不用强迫每天记录。</div><div class="form-group"><label>想到哪颗星星（可选）</label><select id="sd-star"><option value="">不指定</option>'+stars.map(x=>'<option value="'+x.id+'" '+((old&&old.starId===x.id)?'selected':'')+'>'+Utils.esc(x.title)+'</option>').join('')+'</select></div><div class="form-group"><label>今天想到的</label><textarea id="sd-content" rows="3" placeholder="今天发生了什么，让我想起了某颗星星…">'+(old?Utils.esc(old.content):'')+'</textarea></div>',{footer:'<button class="btn btn-ghost" onclick="Modal.close()">取消</button><button class="btn btn-primary" onclick="StarMap.saveDiary()">保存</button>'})},
async saveDiary(){const content=document.getElementById('sd-content').value.trim();if(!content){Toast.error('写点什么吧');return}const starId=document.getElementById('sd-star').value||null;let starTitle='';if(starId){const st=await DB.get(STORES.stars,starId);starTitle=st?st.title:''}const d=Utils.today();const old=(await StarMap.all()).find(x=>x.kind==='diary'&&x.date===d);await DB.put(STORES.stars,{id:old?old.id:('sd-'+d),kind:'diary',date:d,content,starId,starTitle,createdAt:old?old.createdAt:Utils.now()});Modal.close();Toast.success('星星日记已保存');StarMap.view()},
async review(){const now=new Date();const ym=Utils.fmtDate(now).slice(0,7);const all=await StarMap.wishes();const month=all.filter(s=>(s.createdAt||'').slice(0,7)===ym);const cnt={realized:0,partial:0,waiting:0,none:0,closed:0};month.forEach(s=>{if(cnt[s.status]!==undefined)cnt[s.status]++});const realized=all.filter(s=>s.status==='realized');const catCnt={};all.forEach(s=>{if(s.pickedAt)return;if(s.category)catCnt[s.category]=(catCnt[s.category]||0)+1});const topCat=Object.entries(catCnt).sort((a,b)=>b[1]-a[1])[0];let cycles=[];all.forEach(s=>{(s.events||[]).forEach(e=>{if(!e.date)return;const dd=Utils.daysBetween(Utils.fmtDate(s.createdAt),e.date);if(dd!==null&&dd!==undefined&&dd>=0)cycles.push(dd)})});const avgCycle=cycles.length?Math.round(cycles.reduce((a,b)=>a+b,0)/cycles.length):null;let h='<h3 style="margin-bottom:10px">'+ym.slice(0,4)+'年'+parseInt(ym.slice(5))+'月 链接星图回顾</h3>';h+='<div class="grid grid-4 mb-4"><div class="stat-card"><div class="stat-value">'+month.length+'</div><div class="stat-label">本月新增愿望</div></div><div class="stat-card"><div class="stat-value">'+cnt.realized+'</div><div class="stat-label">已实现</div></div><div class="stat-card"><div class="stat-value">'+cnt.partial+'</div><div class="stat-label">部分对应</div></div><div class="stat-card"><div class="stat-value">'+(cnt.waiting+cnt.none)+'</div><div class="stat-label">等待观察/暂未发生</div></div></div>';if(topCat)h+='<div class="card mb-4" style="padding:14px"><b class="text-sm">最常出现的愿望主题</b><div class="text-sm text-muted mt-1" style="line-height:1.7">你在星空中最常许下的是「'+Utils.esc(topCat[0])+'」类愿望（'+topCat[1]+'颗）。从记录来看，你近期比较关注'+(topCat[0]==='互动愿望'?'现实互动与交流':topCat[0]==='日常小显化'?'生活中的小巧合与信号':topCat[0]==='关系成长愿望'?'关系的共同成长与了解':'自己的内在稳定与安全感')+'。</div></div>';if(realized.length){h+='<div class="card mb-4" style="padding:14px"><b class="text-sm">已实现愿望回顾</b>'+realized.map(s=>{const fe=(s.events||[])[0];return '<div class="list-item"><div class="item-main"><div class="item-title" style="font-size:13px">'+StarMap.STATUS.realized.icon+' '+Utils.esc(s.title)+'</div><div class="item-sub">许愿 '+Utils.fmtDate(s.createdAt)+(fe?' · 首次对应事件 '+fe.date:'')+'</div></div></div>'}).join('')+'</div>'}h+='<div class="card mb-4" style="padding:14px"><b class="text-sm">愿望实现周期</b><div class="text-sm text-muted mt-1">'+(avgCycle!==null?'从许愿到记录第一个相关事件，平均经过 '+avgCycle+' 天。':'还没有足够的「愿望 → 现实事件」配对来计算周期，继续观察吧。')+'</div></div>';h+='<div class="card mb-4" style="padding:14px"><b class="text-sm">愿望模式（AI 分析）</b><div class="text-sm text-muted mt-1" style="line-height:1.8">'+(all.length?'目前天空中有 '+all.filter(s=>!s.pickedAt&&s.status!=='closed').length+' 颗星星、宝物袋 '+all.filter(s=>s.pickedAt).length+' 件宝物。可以继续观察自己真正想要的体验是什么：哪些愿望在现实中出现了对应，哪些没有，你的关注点是否发生了变化。':'星图还是空的，先许下第一颗星星吧。')+'</div><div class="ai-notice mt-2">以上为 AI 根据星图记录本地生成的观察与推测，仅供参考，不构成对未来的预测，不代表愿望一定会实现。</div></div>';Modal.open('星图回顾',h,{size:'lg'})}
};

tags(id){const el=document.getElementById(id);if(!el)return[];return[...el.querySelectorAll('.ls-tag.on')].map(x=>x.textContent)},
tagGroup(id,items,sel){return'<div class="dm-tags-wrap" id="'+id+'">'+items.map(i=>'<span class="ls-tag'+((sel||[]).includes(i)?' on':'')+'" onclick="this.classList.toggle(\'on\')">'+i+'</span>').join('')+'</div>'},
row(l,v){return v?'<div class="dm-row"><b>'+l+'</b><div style="flex:1;white-space:pre-wrap">'+Utils.esc(v)+'</div></div>':''},

const date=dt.slice(0,10);
const bed=document.getElementById('df-bed').value;let dur=document.getElementById('df-dur').value.trim();

},
backToForm(){const k=Inspiration._keep;Inspiration._keep=null;Inspiration.showForm();setTimeout(()=>{if(!k)return;const c=document.getElementById('in-content'),s=document.getElementById('in-source'),d=document.getElementById('in-date');if(c)c.value=k.content;if(s)s.value=k.source;if(d)d.value=k.date},50)},
saveCat(){
const v=document.getElementById('ic-name').value.trim();
if(!v){Toast.error('先写一个分类名');return}
const cats=Inspiration.cats();
if(cats.includes(v)){Toast.error('这个分类已存在')}
else{cats.push(v);App.settings.inspirationCats=cats;Store.setSettings(App.settings);Toast.success('分类已添加')}

Inspiration.showForm();
setTimeout(()=>{const c=document.getElementById('in-content'),s=document.getElementById('in-source'),d=document.getElementById('in-date');if(c)c.value=k.content;if(s)s.value=k.source;if(d)d.value=k.date},50);
},
async save(){

const id=Inspiration._editId||Utils.uid();
Inspiration._editId=null;

},

const AICore={
 async afterInit(){
  try{
   const s=App.settings;
   if(!s)return;
   let changed=false;
   const defs=getDefaultSettings({});
   for(const k of ['aiSummaryEnabled','aiSummaryModules','aiProactive','aiMemory','emotionMode','chatHistoryLimit','userNick','keepAlive','notifyEnabled','notifyOnReply','notifyOnProactive']){
    if(s[k]===undefined){s[k]=defs[k];changed=true}
   }
   if(s.wizardDone===undefined){s.wizardDone=(s.dataVersion===undefined||s.dataVersion<2);changed=true}
   if(!s.moduleVisibility) s.moduleVisibility=defs.moduleVisibility;
   for(const k of ['knowledge','learning','aiChat','todo','keepalive','notify']){if(s.moduleVisibility[k]===undefined){s.moduleVisibility[k]=true;changed=true}}
   if(s.dataVersion<2){
    if(s.soulRecordTypes&&!s.soulRecordTypes.includes('AI 对话摘录')){s.soulRecordTypes.push('AI 对话摘录')}
    s.wizardDone=s.wizardDone===undefined?true:s.wizardDone;
    s.dataVersion=2;changed=true;
   }
   if(changed){Store.setSettings(s);App.settings=s}
   try{await AICore.autoBackup()}catch(e){}
   if(!s.wizardDone){setTimeout(()=>Wizard.start(),400)}
   AIProactive.start();
  }catch(e){console.warn('AICore.afterInit',e)}
 },
 async autoBackup(){
  const bks=(await DB.getAll(STORES.backups)).filter(b=>b.type==='auto');
  if(bks.length===0){await App.createBackup('auto');return}
  const last=new Date(Math.max(...bks.map(b=>new Date(b.createdAt).getTime()||0)));
  if((Date.now()-last.getTime())>86400000){await App.createBackup('auto')}
 }
};

const Wizard={
 step:0,

  const st=Wizard.steps;
  Modal.open('✦ 首次启动向导','<div class="wiz-steps">'+st.map((x,i)=>`<div class="wiz-step${i===Wizard.step?' cur':''}">${i+1}. ${x}</div>`).join('')+'</div><div id="wiz-body">'+Wizard.body()+'</div>',
  {size:'lg',footer:'<button class="btn btn-ghost" id="wiz-prev">上一步</button><button class="btn btn-primary" id="wiz-next">下一步</button>'});
  document.getElementById('wiz-prev').onclick=()=>{if(Wizard.step>0){Wizard.save();Wizard.step--;Wizard.render()}};
  document.getElementById('wiz-next').onclick=()=>{if(!Wizard.save())return;if(Wizard.step<st.length-1){Wizard.step++;Wizard.render()}else{Wizard.finish()}};
 },

/* ---------- 协议适配层 ---------- */
const AIAdapters={
 parseHeaders(h){try{return h?JSON.parse(h):{}}catch(e){return {}}},
 buildRequest(conn,messages,opts={}){
  const stream=opts.stream!==false&&conn.stream!==false;
  const maxTokens=opts.maxTokens||conn.maxTokens||2048;
  const temp=(opts.temperature!==undefined?opts.temperature:conn.temperature!==undefined?conn.temperature:0.8);
  const key=conn.apiKey||'';
  if(conn.protocol==='openai'){
   return{url:conn.baseUrl+'/chat/completions',method:'POST',headers:{'Content-Type':'application/json; charset=utf-8','Authorization':'Bearer '+key,...AIAdapters.parseHeaders(conn.headers)},body:JSON.stringify({model:conn.model,messages:messages,temperature:temp,top_p:conn.topP!==undefined?conn.topP:1,max_tokens:maxTokens,stream:stream}),stream:stream};
  }
  if(conn.protocol==='anthropic'){
   const sys=messages.filter(m=>m.role==='system').map(m=>m.content).join('\n\n');
   const rest=messages.filter(m=>m.role!=='system').map(m=>({role:m.role==='assistant'?'assistant':'user',content:m.content}));
   return{url:conn.baseUrl+'/v1/messages',method:'POST',headers:{'Content-Type':'application/json; charset=utf-8','x-api-key':key,'anthropic-version':'2023-06-01',...AIAdapters.parseHeaders(conn.headers)},body:JSON.stringify({model:conn.model,max_tokens:maxTokens,temperature:temp,system:sys||undefined,messages:rest,stream:stream}),stream:stream};
  }
  if(conn.protocol==='gemini'){
   const sys=messages.filter(m=>m.role==='system').map(m=>m.content).join('\n\n');
   const contents=messages.filter(m=>m.role!=='system').map(m=>({role:m.role==='assistant'?'model':'user',parts:[{text:m.content}]}));
   const url=conn.baseUrl+'/v1beta/models/'+conn.model+':'+(stream?'streamGenerateContent?alt=sse':'generateContent');
   return{url:url,method:'POST',headers:{'Content-Type':'application/json; charset=utf-8','x-goog-api-key':key,...AIAdapters.parseHeaders(conn.headers)},body:JSON.stringify({contents:contents,systemInstruction:sys?{parts:[{text:sys}]}:undefined,generationConfig:{temperature:temp,maxOutputTokens:maxTokens}}),stream:stream};
  }
  if(conn.protocol==='custom'){
   const cu=conn.custom||{};
   let body=cu.bodyTemplate||'';
   body=body.replace(/__MSGS__/g,JSON.stringify(messages));
   let url=cu.urlTemplate||'';
   const hd={...(AIAdapters.parseHeaders(cu.headerTemplate)),'Authorization':'Bearer '+key};
   return{url:url,method:cu.method||'POST',headers:hd,body:body,stream:false,customPath:cu.respTextPath};
  }
  throw new Error('未知协议：'+conn.protocol);
 },
 extractDelta(j,protocol){
  try{
   if(protocol==='openai')return j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content||'';
   if(protocol==='anthropic')return j.type==='content_block_delta'&&j.delta&&j.delta.text||'';
   if(protocol==='gemini'){const c=j.candidates&&j.candidates[0];return c&&c.content&&c.content.parts?c.content.parts.map(p=>p.text||'').join(''):''}
   if(protocol==='custom')return '';
  }catch(e){}
  return '';
 },
 extractFull(j,protocol,customPath){
  try{
   if(protocol==='openai')return j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content||'';
   if(protocol==='anthropic')return Array.isArray(j.content)?j.content.filter(x=>x.type==='text').map(x=>x.text).join(''):'';
   if(protocol==='gemini'){const c=j.candidates&&j.candidates[0];return c&&c.content&&c.content.parts?c.content.parts.map(p=>p.text||'').join(''):''}
   if(protocol==='custom'){let cur=j;for(const k of (customPath||'').split('.')){if(cur===undefined||cur===null)return '';const idx=k.indexOf('[');if(idx===0){cur=cur[parseInt(k.replace(/[\[\]]/g,''))]}else if(idx>0){const key=k.slice(0,idx);cur=cur[key];if(cur&&k.slice(idx).match(/\[(\d+)\]/))cur=cur[parseInt(k.slice(idx).match(/\[(\d+)\]/)[1])]}else cur=cur[k]}return typeof cur==='string'?cur:''}
  }catch(e){}
  return '';
 },
 classifyError(e,status){
  if(status===401||status===403)return '密钥无效或无权限（'+status+'），请检查 API Key';
  if(status===404)return '接口地址不存在（404），请检查 Base URL';
  if(status===405)return '请求方法/协议不匹配（405），请检查协议类型';
  if(status===429)return '请求过于频繁或余额不足（429）';
  if(status>=500)return '供应商服务端错误（'+status+'），稍后重试';
  if(e&&(e.name==='TypeError'||String(e.message||'').includes('Failed to fetch')||String(e.message||'').includes('NetworkError')))return '网络/CORS 问题：浏览器直连可能被该供应商拦截（可换供应商或使用支持 CORS 的中转地址）';
  return String((e&&e.message)||e||'未知错误');
 },
 async chat(conn,messages,opts={}){
  if(!conn)throw new Error('未选择模型连接');
  const req=AIAdapters.buildRequest(conn,messages,opts);
  const ctrl=opts.signal?new AbortController():null;
  if(opts.signal){opts.signal.addEventListener('abort',()=>{try{ctrl.abort()}catch(e){}},{once:true})}
  let res;
  try{
   res=await fetch(req.url,{method:req.method,headers:req.headers,body:req.body,signal:ctrl?ctrl.signal:undefined});
  }catch(e){e.status=0;throw e}
  if(!res.ok){
   let msg='';try{const t=await res.text();msg=t.slice(0,200)}catch(e){}
   const err=new Error(msg||('HTTP '+res.status));err.status=res.status;throw err;
  }
  if(req.stream&&res.body&&res.body.getReader){
   const reader=res.body.getReader();const dec=new TextDecoder();
   let buf='',full='';
   while(true){
    const{done,value}=await reader.read();
    if(done)break;
    buf+=dec.decode(value,{stream:true});
    let idx;
    while((idx=buf.indexOf('\n'))>=0){
     const line=buf.slice(0,idx).trim();buf=buf.slice(idx+1);
     if(!line||!line.startsWith('data:'))continue;
     const payload=line.slice(5).trim();
     if(payload==='[DONE]')continue;
     try{const j=JSON.parse(payload);const d=AIAdapters.extractDelta(j,conn.protocol);if(d){full+=d;if(opts.onDelta)opts.onDelta(d)}}catch(e){}
    }
   }
   if(!full)throw new Error('流式响应为空');
   return full;
  }
  const j=await res.json();
  const text=AIAdapters.extractFull(j,conn.protocol,req.customPath);
  if(!text)throw new Error('未能从响应中提取文本');
  if(opts.onDelta&&text)opts.onDelta(text);
  return text;
 }
};

/* ---------- 语音与情感链路 ---------- */
const AIVoice={
 INTERJECTIONS:['(laughs)','(chuckle)','(coughs)','(clear-throat)','(groans)','(breath)','(pant)','(inhale)','(exhale)','(gasps)','(sniffs)','(sighs)','(snorts)','(lip-smacking)','(humming)','(hissing)','(emm)','(whistles)','(sneezes)','(crying)','(applause)'],
 ENUMS:['happy','sad','angry','fearful','disgusted','surprised','calm','fluent','whisper'],
 ZHMAP:{'开心':'happy','高兴':'happy','快乐':'happy','兴奋':'happy','甜蜜':'happy','幸福':'happy','悲伤':'sad','难过':'sad','低落':'sad','委屈':'sad','伤心':'sad','失落':'sad','担心':'sad','想念':'sad','思念':'sad','愤怒':'angry','生气':'angry','气':'angry','恼':'angry','不满':'angry','烦躁':'angry','害怕':'fearful','恐惧':'fearful','紧张':'fearful','不安':'fearful','担心受怕':'fearful','厌恶':'disgusted','嫌弃':'disgusted','讨厌':'disgusted','惊讶':'surprised','吃惊':'surprised','意外':'surprised','震惊':'surprised','平静':'calm','平和':'calm','淡淡':'calm','淡定':'calm','温柔':'calm','轻柔':'calm','无奈':'calm','慵懒':'calm','慵':'calm','认真':'calm','郑重':'calm','生动':'fluent','活泼':'fluent','俏皮':'fluent','低语':'whisper','气声':'whisper','轻声':'whisper','悄悄':'whisper'},
 MODEL_SUPPORT(m){
  const s=String(m||'');
  if(s.startsWith('speech-2.8'))return['happy','sad','angry','fearful','disgusted','surprised','calm'];
  if(s.startsWith('speech-2.6'))return['happy','sad','angry','fearful','disgusted','surprised','calm','fluent','whisper'];
  if(s.startsWith('speech-02'))return['happy','sad','angry','fearful','disgusted','surprised','calm','fluent'];
  if(s.startsWith('speech-01'))return['happy','sad','angry','fearful','disgusted','surprised','calm','fluent'];
  return['happy','sad','angry','fearful','disgusted','surprised','calm'];
 },
 parseEmotionTag(text){
  const m=String(text||'').match(/\[emotion[:：]\s*([^\]\n]{1,30})\]\s*$/i);
  if(!m)return{clean:text,tag:null};
  return{clean:String(text).replace(/\[emotion[:：]\s*[^\]\n]{1,30}\]\s*$/i,'').trim(),tag:m[1].trim()};
 },
 mapEmotion(desc){
  const d=String(desc||'').toLowerCase().trim();
  if(AIVoice.ENUMS.includes(d))return{emotion:d,conf:1};
  for(const zh of Object.keys(AIVoice.ZHMAP)){if(d.includes(zh))return{emotion:AIVoice.ZHMAP[zh],conf:.8}}
  return{emotion:null,conf:0};
 },
 resolveEmotion(conn,tag){
  const support=AIVoice.MODEL_SUPPORT(conn&&conn.model);
  const audit={tagRaw:tag||null,mapped:null,source:tag?'model-tag':'auto',degraded:false};
  if(!tag){audit.source='auto';return{emotion:null,audit}}
  const map=AIVoice.mapEmotion(tag);
  if(!map.emotion){audit.source='auto-fallback';audit.degraded=true;return{emotion:null,audit}}
  audit.mapped=map.emotion;
  if(!support.includes(map.emotion)){audit.degraded=true;return{emotion:null,audit}}
  return{emotion:map.emotion,audit};
 },
 speedFor(emotion,base){
  const b=base||1;
  if(emotion==='sad'||emotion==='calm'||emotion==='whisper')return Math.max(.5,+(b*.92).toFixed(2));
  if(emotion==='happy')return Math.min(2,+(b*1.08).toFixed(2));

 },
 cleanForTTS(text,conn){
  const support28=String(conn&&conn.model||'').startsWith('speech-2.8');
  let t=String(text||'');
  if(!support28){for(const ij of AIVoice.INTERJECTIONS)t=t.split(ij).join('')}
  /* 剥离括号动作描写：中英文括号内的内容只读括号外正文（两遍处理嵌套） */
  t=t.replace(/[（(][^（）()]*[）)]/g,' ');
  t=t.replace(/[（(][^（）()]*[）)]/g,' ');
  return t.replace(/\s{2,}/g,' ').trim();
 },
 async synthesize(conn,opts){
  if(!conn)throw new Error('未选择语音连接');
  const t=conn.tts||{};
  const voiceId=opts.voiceId||t.customVoiceId||t.voiceId||'male-qn-qingse';
  const body={
   model:conn.model,
   text:opts.text||'',
   stream:false,
   language_boost:'Chinese',
   output_format:'hex',
   voice_setting:{voice_id:voiceId,speed:opts.speed||t.speed||1,vol:t.vol||1,pitch:(opts.pitch!==undefined?opts.pitch:(t.pitch||0))},
   audio_setting:{sample_rate:t.sampleRate||32000,bitrate:128000,format:t.format||'mp3',channel:1}
  };
  if(opts.emotion)body.voice_setting.emotion=opts.emotion;
  let url=conn.baseUrl+'/v1/t2a_v2';
  if(t.groupId)url+='?GroupId='+encodeURIComponent(t.groupId);
  let res;
  try{res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json; charset=utf-8','Authorization':'Bearer '+(conn.apiKey||'')},body:JSON.stringify(body)})}
  catch(e){e.status=0;throw e}
  if(!res.ok){let m='';try{m=(await res.text()).slice(0,150)}catch(e){}const err=new Error(m||('HTTP '+res.status));err.status=res.status;throw err}

  }
  const hex=j.data&&j.data.audio;
  if(!hex)throw new Error('未返回音频数据');
  const bytes=new Uint8Array(hex.length/2);
  for(let i=0;i<bytes.length;i++)bytes[i]=parseInt(hex.substr(i*2,2),16);
  const fmt=t.format||'mp3';
  const blob=new Blob([bytes],{type:'audio/'+fmt});
  return{blob:blob,url:URL.createObjectURL(blob),chars:(j.extra_info&&j.extra_info.usage_characters)||(opts.text||'').length,fmt:fmt,hex:hex.slice(0,16)};
 },
 /* ---- 语音条播放控制器 ---- */

 async speakMessage(msg,conv,forceEmotion,opts){

   const r=await AIVoice.synthesize(conn,{text:clean,emotion:emotion,voiceId:voiceId,speed:speed});
   AIVoice._urls[msg.id]=r.url;
   msg.audio={hash:r.hex,dataUrl:r.url,fmt:r.fmt,chars:r.chars};
   msg.emotion={tag:parsed.tag,mapped:audit.mapped,source:audit.source,degraded:audit.degraded,used:emotion};
   await DB.put(STORES.aiMessages,msg);
   const live=document.getElementById('ai-msg-'+msg.id);

    AIVoice.startPlayback(msg.id,r.url);
    if(live){const box=document.getElementById('ai-msgs');if(box)box.scrollTop=box.scrollHeight}
   }else{
    AIVoice.bars(msg.id).forEach(b=>b.classList.remove('loading'));
   }

  }catch(e){
   const m=AIAdapters.classifyError(e,e.status);
   msg.emotion={tag:parsed.tag,mapped:audit.mapped,source:audit.source,degraded:true,error:m};

  }
 }
