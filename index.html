const AIMem={
 async list(convId){return (await DB.getAll(STORES.aiMemories)).filter(m=>!m.deletedAt&&m.convId===convId)},
 async markStale(convId,msgIds){
  const ms=await AIMem.list(convId);
  let n=0;
  for(const m of ms){
   if(m.stale)continue;
   const hit=(m.sourceMsgIds||[]).some(id=>msgIds.includes(id));
   if(hit){m.stale=true;m.staleAt=Utils.now();await DB.put(STORES.aiMemories,m);n++;
    await DB.put(STORES.auditLog,{id:Utils.uid(),type:'memory-stale',convId:convId,memoryId:m.id,at:Utils.now()})}
  }
  return n;
 },
 async pick(conv,userText,limit){
  const all=(await AIMem.list(conv.id)).filter(m=>!m.stale);
  const now=Date.now();
  for(const m of all){
   let score=0;
   for(const k of(m.keywords||[])){if(k&&userText.includes(k))score+=2}
   const age=(now-new Date(m.createdAt).getTime())/86400000;
   score+=Math.max(0,2-age/30);
   if(m.userConfirmed)score+=1;
   m._score=score;
  }
  return all.sort((a,b)=>b._score-a._score).slice(0,limit||10);
 },
 async autoCheck(conv,msgs){
  const cfg=App.settings.aiMemory||{};
  if(!cfg.enabled||!cfg.autoEvery||!conv.summaryConnId)return;
  const since=(conv.lastSummaryAt?msgs.filter(m=>new Date(m.createdAt)>new Date(conv.lastSummaryAt)):msgs).filter(m=>m.active!==false);
  if(since.length<cfg.autoEvery)return;
  const conn=await AIConn.byId(conv.summaryConnId);
  if(!conn){return}
  try{
   const text=since.slice(-cfg.autoEvery*2).map(m=>(m.role==='user'?'用户：':'角色：')+m.content).join('\n').slice(-6000);
   const prompt='请从以下对话中提取值得长期记住的稳定信息：稳定偏好、重要个人信息、重要事件、关系变化、约定、禁忌。忽略日常闲聊碎片，不得编造。逐条输出，每条一行，格式：内容 | 关键词1,关键词2。最多8条。若无值得记录的内容，只输出 NONE。\n\n'+text;
   const out=await AIAdapters.chat(conn,[{role:'user',content:prompt}],{stream:false,temperature:0.2,maxTokens:600});
   if(String(out).trim().toUpperCase()==='NONE')return;
   for(const line of String(out).split('\n')){
    const t=line.trim();if(!t||t==='NONE')continue;
    const[c,kw]=t.split('|');
    await DB.put(STORES.aiMemories,{id:Utils.uid(),convId:conv.id,content:(c||'').trim(),keywords:(kw||'').split(/[,，]/).map(x=>x.trim()).filter(Boolean),objects:'',timeRange:'',sourceMsgIds:since.map(m=>m.id),createdAt:Utils.now(),userConfirmed:false,stale:false,manual:false});
   }
   conv.lastSummaryAt=Utils.now();await DB.put(STORES.aiConversations,conv);
   Toast.info('已生成 '+String(out).split('\n').filter(x=>x.trim()&&x.trim()!=='NONE').length+' 条自动长记忆');
  }catch(e){console.warn('auto summary failed',e)}
 },

/* ---------- 角色主动消息（浏览器环境受限说明） ---------- */
const AIProactive={
 _timer:null,_paused:false,
 start(){
  if(AIProactive._timer)clearTimeout(AIProactive._timer);
  const cfg=App.settings.aiProactive||{};
  if(cfg.mode==='off')return;
  const delay=(15+Math.random()*30)*60000;
  AIProactive._timer=setTimeout(()=>AIProactive.check(),delay);
 },
 inQuietHours(){
  const cfg=App.settings.aiProactive||{};
  const now=new Date();const hm=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  const s=cfg.quietStart||'23:00',e=cfg.quietEnd||'07:00';
  if(s<=e)return hm>=s&&hm<e;
  return hm>=s||hm<e;
 },
 async check(){
  try{
   const cfg=App.settings.aiProactive||{};
   if(cfg.mode==='off'||AIProactive._paused){AIProactive.start();return}
   if(AIProactive.inQuietHours()){AIProactive.start();return}
   const convs=(await DB.getAll(STORES.aiConversations)).filter(c=>!c.deletedAt&&!c.archived);
   for(const conv of convs){
    if(!conv.proactiveEnabled)continue;
    const msgs=(await DB.getAll(STORES.aiMessages)).filter(m=>m.convId===conv.id&&m.active!==false);
    const lastMsg=msgs[msgs.length-1];
    const lastAt=lastMsg?new Date(lastMsg.createdAt).getTime():new Date(conv.createdAt).getTime();
    const hrs=(Date.now()-lastAt)/3600000;
    if(hrs<(cfg.cooldownHours||12))continue;
    const today=Utils.today();
    const sentToday=msgs.filter(m=>m.proactive&&m.dateStr===today).length;
    if(sentToday>=(cfg.dailyMax||3))continue;
    if(Math.random()<0.5)continue;
    await AIProactive.generate(conv,cfg);
    break;
   }
  }catch(e){console.warn('proactive check',e)}
  AIProactive.start();
 },
 async generate(conv,cfg){
  const conn=await AIConn.byId(conv.chatConnId);
  if(!conn)return;
  const lastMsgs=(await DB.getAll(STORES.aiMessages)).filter(m=>m.convId===conv.id&&m.active!==false).slice(-6);
  const summary=await AIOverview.build();
  const sys='你正在扮演用户设定的角色。距离上次对话已有一段时间。请自然地开启一句主动的问候或延续上次的话题：可以表达想念、分享一个小话题、或承接未完成的对话。禁止使用内疚、威胁、贬低或制造依赖的表述。只输出角色的一句话，30字以内，不要解释。'+(summary?('\n可参考的用户授权摘要：'+summary):'');
  const hist=lastMsgs.map(m=>({role:m.role==='assistant'?'assistant':'user',content:m.content}));
  try{
   const out=await AIAdapters.chat(conn,[{role:'system',content:sys},...hist],{stream:false,temperature:.9,maxTokens:120});
   const msg={id:Utils.uid(),convId:conv.id,role:'assistant',content:String(out).trim(),createdAt:Utils.now(),dateStr:Utils.today(),active:true,proactive:true,aiGenerated:true,status:'done',sourceType:'ai',
    trigger:{time:Utils.now(),reason:'距离上次对话超过'+(cfg.cooldownHours||12)+'小时',dataUsed:App.settings.aiSummaryEnabled?'受控摘要（已授权）':'无',connId:conv.chatConnId}};
   if(cfg.mode==='draft'){
    await DB.put(STORES.auditLog,{id:Utils.uid(),type:'proactive-draft',convId:conv.id,msgId:msg.id,at:Utils.now()});
    AIProactive._drafts=AIProactive._drafts||[];AIProactive._drafts.push(msg);
    Toast.info('角色主动消息已生成草稿（跨维沟通 → 主动消息）');
   }else{
    await DB.put(STORES.aiMessages,msg);
    Toast.info('角色发来一条主动消息（AI 生成）');try{Notify.onProactive(conv,msg)}catch(e){}
   }

  }catch(e){console.warn('proactive gen',e)}
 },

 async delConv(id){Modal.confirm('删除该会话将同时归档其全部消息与长记忆（软删除，可从备份恢复）。确定？',async()=>{

 async send(){

 },
 stop(){if(AIChat._genCtrl){try{AIChat._genCtrl.abort()}catch(e){}Toast.info('已请求停止')}},
 async generate(conv){
  if(AIChat._genCtrl)return;
  const conn=await AIConn.byId(conv.chatConnId);
  if(!conn){Toast.error('该会话未绑定模型连接');AIChat.settings(conv.id);return}
  const all=(await DB.getAll(STORES.aiMessages)).filter(m=>m.convId===conv.id&&m.active!==false&&!m.deletedAt).sort((a,b)=>(a.createdAt||'').localeCompare(b.createdAt||''));
  const lastUser=[...all].reverse().find(m=>m.role==='user');
  if(!lastUser){Toast.error('没有可回复的用户消息');return}
  const hist=all.slice(0,-1).slice(-(conv.chatHistoryLimit||40)).map(m=>({role:m.role,content:AIVoice.parseEmotionTag(m.content).clean}));
  const built=await AIOrch.build(conv,hist,lastUser.content);
  const msg={id:Utils.uid(),convId:conv.id,role:'assistant',content:'',createdAt:Utils.now(),dateStr:Utils.today(),active:true,aiGenerated:true,status:'generating',sourceType:'ai'};
  await DB.put(STORES.aiMessages,msg);
  AIChat.renderMain();
  const live=document.getElementById('ai-msg-'+msg.id);
  AIChat._genCtrl=new AbortController();
  let full='';
  try{
   full=await AIAdapters.chat(conn,built.messages,{stream:true,signal:AIChat._genCtrl.signal,onDelta:d=>{const l=document.getElementById('ai-live-'+msg.id);if(l){l.textContent+=d;const b=document.getElementById('ai-msgs');if(b)b.scrollTop=b.scrollHeight}}});
  }catch(e){
   const aborted=e&&(e.name==='AbortError'||String(e.message||'').toLowerCase().includes('abort'));
   const l=document.getElementById('ai-live-'+msg.id);const partial=l?l.textContent:full;
   AIChat._genCtrl=null;
   msg.content=AIVoice.parseEmotionTag(partial).clean;
   if(msg.content){msg.status=aborted?'stopped':'error';await DB.put(STORES.aiMessages,msg)}
   else{await DB.del(STORES.aiMessages,msg.id)}
   if(!aborted)Toast.error('生成失败：'+AIAdapters.classifyError(e,e.status));
   AIChat.renderMain();return;
  }
  AIChat._genCtrl=null;
  const parsed=AIVoice.parseEmotionTag(full);
  msg.content=full;msg.status='done';msg.emotionTag=parsed.tag;
  conv.updatedAt=Utils.now();await DB.put(STORES.aiConversations,conv);
  if(conv.voiceEnabled&&conv.ttsConnId&&conv.emotionMode!=='off'){
   try{await AIVoice.speakMessage(msg,conv)}catch(e){}
   msg.content=parsed.clean;
   await DB.put(STORES.aiMessages,msg);
  }else{
   msg.content=parsed.clean;
   await DB.put(STORES.aiMessages,msg);
  }
  AIChat.renderMain();
  try{Notify.onReply(conv,msg)}catch(e){}
  try{await AIMem.autoCheck(conv,(await DB.getAll(STORES.aiMessages)).filter(m=>m.convId===conv.id))}catch(e){console.warn('autoMem',e)}
 },
 async activeMsgs(convId){return (await DB.getAll(STORES.aiMessages)).filter(m=>m.convId===convId&&m.active!==false&&!m.deletedAt).sort((a,b)=>(a.createdAt||'').localeCompare(b.createdAt||''))},
 async allMsgs(convId){return (await DB.getAll(STORES.aiMessages)).filter(m=>m.convId===convId&&!m.deletedAt).sort((a,b)=>(a.createdAt||'').localeCompare(b.createdAt||''))},
 async sealFrom(convId,idx,reason){
  const msgs=await AIChat.activeMsgs(convId);
  const sealed=msgs.slice(idx);
  if(!sealed.length)return[];
  const cutAt=Utils.now();
  for(const m of sealed){m.active=false;m.sealedAt=cutAt;m.sealedReason=reason;m.branch={cutAt:cutAt};await DB.put(STORES.aiMessages,m)}
  await AIMem.markStale(convId,sealed.map(m=>m.id));
  await DB.put(STORES.auditLog,{id:Utils.uid(),type:'branch-seal',convId:convId,reason:reason,msgIds:sealed.map(m=>m.id),at:cutAt});
  return sealed.map(m=>m.id);
 },
 async regen(id){

  Modal.open('分支历史',html+'<p class="text-sm text-muted" style="margin-top:8px">被封存的消息永不物理删除；恢复分支会封存当前时间线上的后续消息，双向可切换。被封存分支引用的长记忆已自动标记 stale。</p>',{size:'lg',footer:'<button class="btn btn-primary" onclick="Modal.close()">关闭</button>'});
 },
 async restoreBranch(convId,cutAt){
  Modal.confirm('恢复该分支？当前时间线上更晚的消息会被封存（同样可再切回）。',async()=>{
   const msgs=await AIChat.allMsgs(convId);   const group=msgs.filter(m=>m.active===false&&m.sealedAt===cutAt);
   const laterActive=msgs.filter(m=>m.active!==false&&new Date(m.createdAt)>new Date(cutAt));
   const now=Utils.now();
   for(const m of laterActive){m.active=false;m.sealedAt=now;m.sealedReason='branch-swap';m.branch={cutAt:now};await DB.put(STORES.aiMessages,m)}
   for(const m of group){m.active=true;m.sealedAt=null;m.sealedReason=null;m.branch=null;await DB.put(STORES.aiMessages,m)}
   Modal.close();Toast.success('分支已恢复');AIChat.renderMain();
  });
 },
 async searchMsgs(convId){

const Learning={
 async all(){return (await DB.getAll(STORES.learning)).filter(l=>!l.deletedAt)},
 weekDates(){const ws=Utils.weekStart();const arr=[];for(let i=0;i<7;i++){const d=new Date(ws);d.setDate(ws.getDate()+i);arr.push(Utils.fmtDate(d))}return arr},
 streak(l){
  const ci=l.checkins||{};let n=0;const d=new Date();
  if(!ci[Utils.fmtDate(d)])d.setDate(d.getDate()-1);
  while(ci[Utils.fmtDate(d)]){n++;d.setDate(d.getDate()-1)}
  return n;
 },
 async render(){
  const ls=await Learning.all();
  const week=Learning.weekDates();const today=Utils.today();
  const headers=week.map((d,i)=>'<div style="text-align:center;font-size:11px;color:var(--text-secondary);padding:2px 0">'+['一','二','三','四','五','六','日'][i]+'<br>'+(d===today?'<b style="color:var(--primary)">'+d.slice(8)+'</b>':d.slice(8))+'</div>').join('');
  const rows=ls.map(l=>{
   const ci=l.checkins||{};
   const weekDone=week.filter(d=>ci[d]).length;
   const goal=l.weeklyGoal||5;
   const pct=Math.min(100,Math.round(weekDone/goal*100));
   const days=week.map(d=>'<div style="text-align:center"><button class="btn btn-sm '+(ci[d]?'btn-primary':'btn-ghost')+'" style="min-width:30px;padding:4px 6px" onclick="Learning.toggle(\''+l.id+'\',\''+d+'\')">'+(ci[d]?'✓':'·')+'</button></div>').join('');
   return '<div class="card" style="margin-bottom:10px"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><b style="min-width:120px">'+Utils.esc(l.subject)+'</b><span class="tag">周目标 '+goal+' 天</span><span class="tag">本周 '+weekDone+'</span><span class="tag">连续 '+Learning.streak(l)+' 天</span><span style="flex:1"></span><div style="min-width:140px"><div style="font-size:10px;color:var(--text-muted);text-align:right">'+pct+'%</div><div style="height:6px;background:var(--bg-secondary);border-radius:4px"><div style="height:6px;border-radius:4px;width:'+pct+'%;background:var(--primary)"></div></div></div><button class="btn btn-sm btn-ghost" onclick="Learning.showForm(\''+l.id+'\')">编辑</button></div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px">'+days+'</div>'+(l.note?'<div class="text-sm text-muted" style="margin-top:6px">'+Utils.esc(l.note)+'</div>':'')+'</div>';
  }).join('')||'<div class="text-muted text-sm" style="padding:8px">暂无学习目标</div>';
  document.getElementById('main').innerHTML='<div class="page-header"><div><h1>学习打卡</h1><div class="subtitle">周目标 · 连续天数 · 点击格子即可打卡</div></div><div class="flex gap-2"><button class="btn btn-primary btn-sm" onclick="Learning.showForm()">＋ 新目标</button></div></div><div class="card mb-4"><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">'+headers+'</div></div>'+rows;
 },
 async toggle(id,date){
  const l=await DB.get(STORES.learning,id);if(!l)return;
  l.checkins=l.checkins||{};
  if(l.checkins[date])delete l.checkins[date];
  else{l.checkins[date]=true;await DB.put(STORES.learningLogs,{id:Utils.uid(),goalId:id,subject:l.subject,date:date,createdAt:Utils.now()})}
  l.updatedAt=Utils.now();
  await DB.put(STORES.learning,l);
  Learning.render();
 },
 showForm(id){if(id){DB.get(STORES.learning,id).then(l=>{if(l)Learning.form(l)})}else Learning.form(null)},
 form(l){
  const isNew=!l;l=l||{subject:'',weeklyGoal:5,note:''};
  Modal.open(isNew?'新学习目标':'编辑目标','<div class="form-group"><label>科目/目标</label><input type="text" id="lg-sub" value="'+Utils.esc(l.subject)+'" placeholder="例如：日语 N3 词汇"></div><div class="form-row"><div class="form-group"><label>每周目标（天）</label><input type="number" id="lg-goal" min="1" max="7" value="'+(l.weeklyGoal||5)+'"></div></div><div class="form-group"><label>备注</label><input type="text" id="lg-note" value="'+Utils.esc(l.note||'')+'"></div>',{footer:'<button class="btn btn-ghost" onclick="Modal.close()">取消</button>'+(isNew?'':'<button class="btn btn-danger btn-sm" style="float:left" onclick="Learning.del(\''+l.id+'\')">删除</button>')+'<button class="btn btn-primary" onclick="Learning.save(\''+(l.id||'')+'\')">保存</button>'});
 },
 async save(id){
  let l;
  if(id){l=await DB.get(STORES.learning,id);if(!l)return}
  else{l={id:Utils.uid(),createdAt:Utils.now(),checkins:{},sourceType:'user'}}
  l.subject=document.getElementById('lg-sub').value.trim()||'未命名目标';
  l.weeklyGoal=Math.max(1,Math.min(7,parseInt(document.getElementById('lg-goal').value)||5));
  l.note=document.getElementById('lg-note').value.trim();
  l.updatedAt=Utils.now();
  await DB.put(STORES.learning,l);
  Modal.close();Toast.success('已保存');Learning.render();
 },
 async del(id){Modal.confirm('删除该目标（软删除，打卡记录保留）？',async()=>{const l=await DB.get(STORES.learning,id);if(l){l.deletedAt=Utils.now();await DB.put(STORES.learning,l)}Modal.close();Toast.success('已删除');Learning.render()})}
};
